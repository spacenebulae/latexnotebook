            function collectIndivisibleLineBoxes(container) {
                const containerRect = container.getBoundingClientRect();
                const baseTop = containerRect.top;
                const boxes = [];

                // Treat every KaTeX display/inline formula as an indivisible vertical unit
                const katexNodes = container.querySelectorAll('.katex-display, .katex');
                for (let i = 0; i < katexNodes.length; i++) {
                    const el = katexNodes[i];
                    if (el.classList.contains('katex') && el.closest('.katex-display')) continue;
                    const r = el.getBoundingClientRect();
                    if (r.height > 0) {
                        boxes.push({
                            top: r.top - baseTop,
                            bottom: r.bottom - baseTop
                        });
                    }
                }

                // Walk plain text nodes outside .katex to detect individual visual line rects
                const walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT, {
                    acceptNode: (node) => {
                        if (!node.nodeValue || !node.nodeValue.trim()) {
                            return NodeFilter.FILTER_REJECT;
                        }
                        if (node.parentElement && node.parentElement.closest('.katex')) {
                            return NodeFilter.FILTER_REJECT;
                        }
                        return NodeFilter.FILTER_ACCEPT;
                    }
                });

                const range = document.createRange();
                let currentNode;
                while ((currentNode = walker.nextNode())) {
                    range.selectNodeContents(currentNode);
                    const rects = range.getClientRects();
                    for (let i = 0; i < rects.length; i++) {
                        const r = rects[i];
                        if (r.height > 0) {
                            boxes.push({
                                top: r.top - baseTop,
                                bottom: r.bottom - baseTop
                            });
                        }
                    }
                }

                return boxes;
            }

            function computeSmartPageSlices(totalHeight, pageContentHeightPx, boxes) {
                const slices = [];
                let currentTop = 0;
                const minAdvance = Math.max(36, Math.floor(pageContentHeightPx * 0.2));

                while (currentTop < totalHeight - 2) {
                    const idealEnd = Math.min(totalHeight, currentTop + pageContentHeightPx);
                    if (idealEnd >= totalHeight - 2) {
                        slices.push({
                            y: currentTop,
                            height: Math.max(1, totalHeight - currentTop)
                        });
                        break;
                    }

                    let chosenEnd = idealEnd;
                    for (let i = 0; i < boxes.length; i++) {
                        const b = boxes[i];
                        if (b.top < idealEnd - 1 && b.bottom > idealEnd + 1) {
                            const candidateTop = Math.floor(b.top) - 2;
                            if (candidateTop - currentTop >= minAdvance && candidateTop < chosenEnd) {
                                chosenEnd = candidateTop;
                            }
                        }
                    }

                    const sliceHeight = Math.max(minAdvance, chosenEnd - currentTop);
                    slices.push({ y: currentTop, height: sliceHeight });
                    currentTop += sliceHeight;
                }

                return slices.length > 0 ? slices : [{ y: 0, height: Math.max(1, totalHeight) }];
            }

            async function captureSingleCanvasForPdfSlice(clone, width, slice, scale, bgColor) {
                const html2canvas = window.html2canvas;
                const viewport = document.createElement('div');
                viewport.dataset.pdfSliceViewport = 'true';
                viewport.style.cssText = [
                    'position: fixed',
                    'left: 0',
                    'top: 0',
                    'width: ' + width + 'px',
                    'height: ' + Math.ceil(slice.height) + 'px',
                    'overflow: hidden',
                    'background: ' + bgColor,
                    'opacity: 0',
                    'z-index: -2147483648',
                    'pointer-events: none',
                    'box-sizing: border-box'
                ].join(';');

                const cloneCopy = clone.cloneNode(true);
                cloneCopy.dataset.pdfSliceClone = 'true';
                cloneCopy.style.setProperty('position', 'absolute', 'important');
                cloneCopy.style.setProperty('left', '0px', 'important');
                cloneCopy.style.setProperty('top', (-slice.y) + 'px', 'important');
                cloneCopy.style.setProperty('opacity', '1', 'important');
                cloneCopy.style.setProperty('z-index', '1', 'important');

                viewport.appendChild(cloneCopy);
                document.body.appendChild(viewport);

                try {
                    return await html2canvas(viewport, {
                        backgroundColor: bgColor,
                        scale,
                        width,
                        height: Math.ceil(slice.height),
                        x: 0,
                        y: 0,
                        windowWidth: Math.max(document.documentElement.clientWidth, width),
                        windowHeight: Math.max(window.innerHeight, Math.ceil(slice.height)),
                        scrollX: 0,
                        scrollY: 0,
                        useCORS: true,
                        allowTaint: false,
                        logging: false,
                        onclone: (clonedDoc) => {
                            const vp = clonedDoc.querySelector('[data-pdf-slice-viewport="true"]');
                            if (vp) {
                                vp.style.setProperty('opacity', '1', 'important');
                                vp.style.setProperty('z-index', '2147483647', 'important');
                            }
                        }
                    });
                } finally {
                    viewport.remove();
                }
            }

            async function exportPreviewAsPdf(event) {
                if (event) event.preventDefault();
                if (exportingPdf || !currentUser) return;

                savePdfOptionPreferences();
                const opts = getPdfOptionsFromForm();

                exportingPdf = true;
                pdfConfirmBtn.disabled = true;
                pdfCancelBtn.disabled = true;
                exportPdfBtn.disabled = true;
                const origBtnText = pdfConfirmBtn.textContent;
                pdfConfirmBtn.textContent = 'Generating...';

                let clone = null;
                try {
                    setStatus('Loading PDF export tools...');
                    const [html2canvas, JsPDF] = await Promise.all([loadHtml2Canvas(), loadJsPdf()]);

                    if (document.fonts && document.fonts.ready) {
                        await document.fonts.ready;
                    }

                    const baseDims = PAGE_SIZES_PT[opts.pageSize];
                    const pageW = opts.orientation === 'landscape' ? baseDims[1] : baseDims[0];
                    const pageH = opts.orientation === 'landscape' ? baseDims[0] : baseDims[1];
                    const marginPt = mmToPt(MARGIN_MM_MAP[opts.margins]);
                    const printableW = Math.max(72, pageW - marginPt * 2);
                    const printableH = Math.max(72, pageH - marginPt * 2);

                    // Render CSS width at standard 96 CSS px per inch (72 pt = 96 px)
                    const cssWidth = Math.round(printableW * (96 / 72));
                    const pageContentHeightPx = printableH * (cssWidth / printableW);

                    const useLightTheme = opts.theme === 'light';
                    const previewStyles = getComputedStyle(preview);
                    const bgColor = useLightTheme ? '#ffffff' : previewStyles.backgroundColor;
                    const textColor = useLightTheme ? '#222222' : previewStyles.color;
                    const bgRgb = useLightTheme
                        ? { r: 255, g: 255, b: 255 }
                        : parseRgbColor(bgColor, { r: 33, g: 33, b: 33 });
                    const isDarkPdf = (bgRgb.r * 0.299 + bgRgb.g * 0.587 + bgRgb.b * 0.114) < 128;
                    const footerRgb = isDarkPdf ? { r: 165, g: 165, b: 165 } : { r: 120, g: 120, b: 120 };

                    setStatus('Laying out PDF pages...');
                    clone = createExportSurfaceClone({
                        widthPx: cssWidth,
                        backgroundColor: bgColor,
                        textColor: textColor,
                        fontSizePx: opts.fontSize,
                        padding: opts.margins === 'none' ? '20px' : '0px',
                        docTitle: opts.docTitle,
                        titleBorderColor: isDarkPdf ? '#444444' : '#d4d4d4'
                    });

                    await new Promise((resolve) => requestAnimationFrame(resolve));

                    const bounds = clone.getBoundingClientRect();
                    const totalWidth = Math.max(cssWidth, Math.ceil(bounds.width));
                    const totalHeight = Math.max(1, Math.ceil(Math.max(bounds.height, clone.scrollHeight)));
                    const lineBoxes = collectIndivisibleLineBoxes(clone);
                    const slices = computeSmartPageSlices(totalHeight, pageContentHeightPx, lineBoxes);

                    const doc = new JsPDF({
                        orientation: opts.orientation,
                        unit: 'pt',
                        format: opts.pageSize,
                        compress: true
                    });

                    const canCaptureSingleCanvas =
                        (totalHeight * opts.quality) <= MAX_CANVAS_DIMENSION &&
                        (totalWidth * opts.quality) <= MAX_CANVAS_DIMENSION &&
                        (totalWidth * totalHeight * opts.quality * opts.quality) <= MAX_CANVAS_PIXELS;

                    if (canCaptureSingleCanvas) {
                        setStatus('Rendering PDF content (' + slices.length + (slices.length === 1 ? ' page' : ' pages') + ')...');
                        const fullCanvas = await html2canvas(clone, {
                            backgroundColor: bgColor,
                            scale: opts.quality,
                            width: totalWidth,
                            height: totalHeight,
                            x: 0,
                            y: 0,
                            windowWidth: Math.max(document.documentElement.clientWidth, totalWidth),
                            windowHeight: Math.max(window.innerHeight, totalHeight),
                            scrollX: 0,
                            scrollY: 0,
                            useCORS: true,
                            allowTaint: false,
                            logging: false,
                            onclone: (clonedDoc) => {
                                const exportClone = clonedDoc.querySelector('[data-preview-export-clone="true"]');
                                if (exportClone) {
                                    exportClone.style.setProperty('opacity', '1', 'important');
                                    exportClone.style.setProperty('z-index', '2147483647', 'important');
                                }
                            }
                        });

                        const pageCanvas = document.createElement('canvas');
                        const ctx = pageCanvas.getContext('2d');
                        const srcWidthPx = fullCanvas.width;

                        for (let i = 0; i < slices.length; i++) {
                            if (i > 0) doc.addPage();
                            doc.setFillColor(bgRgb.r, bgRgb.g, bgRgb.b);
                            doc.rect(0, 0, pageW, pageH, 'F');

                            const slice = slices[i];
                            const srcY = Math.max(0, Math.round(slice.y * opts.quality));
                            const srcH = Math.max(1, Math.min(fullCanvas.height - srcY, Math.round(slice.height * opts.quality)));

                            pageCanvas.width = srcWidthPx;
                            pageCanvas.height = srcH;
                            ctx.fillStyle = bgColor;
                            ctx.fillRect(0, 0, srcWidthPx, srcH);
                            ctx.drawImage(fullCanvas, 0, srcY, srcWidthPx, srcH, 0, 0, srcWidthPx, srcH);

                            const imgData = pageCanvas.toDataURL('image/png');
                            const renderHeightPt = (slice.height / totalWidth) * printableW;
                            doc.addImage(imgData, 'PNG', marginPt, marginPt, printableW, renderHeightPt, undefined, 'FAST');

                            if (opts.pageNumbers) {
                                doc.setFont('helvetica', 'normal');
                                doc.setFontSize(9);
                                doc.setTextColor(footerRgb.r, footerRgb.g, footerRgb.b);
                                doc.text(
                                    'Page ' + (i + 1) + ' of ' + slices.length,
                                    pageW / 2,
                                    pageH - Math.max(12, marginPt * 0.5),
                                    { align: 'center' }
                                );
                            }
                        }
                    } else {
                        const perPageScale = Math.min(opts.quality, chooseExportScale(totalWidth, pageContentHeightPx, opts.quality));
                        for (let i = 0; i < slices.length; i++) {
                            setStatus('Rendering PDF page ' + (i + 1) + ' of ' + slices.length + '...');
                            if (i > 0) doc.addPage();
                            doc.setFillColor(bgRgb.r, bgRgb.g, bgRgb.b);
                            doc.rect(0, 0, pageW, pageH, 'F');

                            const slice = slices[i];
                            const sliceCanvas = await captureSingleCanvasForPdfSlice(clone, totalWidth, slice, perPageScale, bgColor);
                            const imgData = sliceCanvas.toDataURL('image/png');
                            const renderHeightPt = (slice.height / totalWidth) * printableW;
                            doc.addImage(imgData, 'PNG', marginPt, marginPt, printableW, renderHeightPt, undefined, 'FAST');

                            if (opts.pageNumbers) {
                                doc.setFont('helvetica', 'normal');
                                doc.setFontSize(9);
                                doc.setTextColor(footerRgb.r, footerRgb.g, footerRgb.b);
                                doc.text(
                                    'Page ' + (i + 1) + ' of ' + slices.length,
                                    pageW / 2,
                                    pageH - Math.max(12, marginPt * 0.5),
                                    { align: 'center' }
                                );
                            }
                        }
                    }

                    setStatus('Saving PDF...');
                    doc.save(opts.fileName + '.pdf');
                    closePdfModal();
                    setStatus('Exported PDF (' + slices.length + (slices.length === 1 ? ' page)' : ' pages)'));
                } catch (error) {
                    console.error('PDF export failed:', error);
                    setStatus('PDF export failed: ' + error.message);
                } finally {
                    if (clone) clone.remove();
                    exportingPdf = false;
                    pdfConfirmBtn.disabled = false;
                    pdfCancelBtn.disabled = false;
                    exportPdfBtn.disabled = false;
                    pdfConfirmBtn.textContent = origBtnText;
                }
            }

            function initPdfModal() {
                loadPdfOptionPreferences();
                updatePdfSummary();

                exportPdfBtn.addEventListener('click', openPdfModal);
                pdfModalCloseBtn.addEventListener('click', () => {
                    if (!exportingPdf) closePdfModal();
                });
                pdfCancelBtn.addEventListener('click', () => {
                    if (!exportingPdf) closePdfModal();
                });
                pdfModalBackdrop.addEventListener('click', (event) => {
                    if (event.target === pdfModalBackdrop && !exportingPdf) {
                        closePdfModal();
                    }
                });

                [pdfFileName, pdfDocTitle, pdfPageSize, pdfOrientation, pdfMargins, pdfTheme, pdfFontSize, pdfQuality, pdfPageNumbers]
                    .forEach((el) => el.addEventListener('change', updatePdfSummary));
                pdfFileName.addEventListener('input', updatePdfSummary);

                pdfExportForm.addEventListener('submit', exportPreviewAsPdf);
            }

            /* ============================================================
               11. Initialization & Event Listeners
               ============================================================ */
            initFontPicker();
            initThemeToggle();
            initRenderToggle();
            initPdfModal();
            initAuth();

            editor.addEventListener('input', onEditorContentChanged);

            editor.addEventListener('keydown', (event) => {
                if (acState.active && acState.matches.length > 0) {
                    if (event.key === 'Tab' && !event.ctrlKey && !event.metaKey && !event.altKey) {
                        event.preventDefault();
                        acceptAutocomplete();
                        return;
                    }
                    if (event.key === 'ArrowDown') {
                        event.preventDefault();
                        acState.selectedIndex = (acState.selectedIndex + 1) % acState.matches.length;
                        renderAutocompleteUI();
                        return;
                    }
                    if (event.key === 'ArrowUp') {
                        event.preventDefault();
                        acState.selectedIndex = (acState.selectedIndex - 1 + acState.matches.length) % acState.matches.length;
                        renderAutocompleteUI();
                        return;
                    }
                    if (event.key === 'Escape') {
                        event.preventDefault();
                        acState.dismissedForTokenAt = acState.tokenStart + ':' + acState.token;
                        hideAutocomplete();
                        return;
                    }
                }
            });

            editor.addEventListener('keyup', (event) => {
                if (['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(event.key)) {
                    updateAutocomplete();
                }
            });

            editor.addEventListener('click', updateAutocomplete);
            editor.addEventListener('scroll', () => {
                if (acState.active) renderAutocompleteUI();
            });
            editor.addEventListener('blur', () => {
                setTimeout(() => {
                    if (document.activeElement !== editor) {
                        hideAutocomplete();
                    }
                }, 120);
            });

            window.addEventListener('resize', () => {
                if (acState.active) renderAutocompleteUI();
            });

            // Re-render once deferred KaTeX scripts finish before DOMContentLoaded
            document.addEventListener('DOMContentLoaded', () => {
                if (currentUser && isDocumentReady && isRenderEnabled) {
                    applyIncrementalPreviewRender(editor.value, true);
                }
            });

            // Flush unsaved edits locally & to cloud if the user hides or closes the page
            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'hidden') {
                    flushLocalDraftSync();
                    if (currentUser && isDocumentReady && hasUnsavedChanges && !hasUnresolvedConflict) {
                        clearTimeout(cloudSaveTimer);
                        cloudSaveTimer = null;
                        flushCloudSave();
                    }
                } else if (document.visibilityState === 'visible') {
                    checkCloudUpdatesOnFocus();
                }
            });

            window.addEventListener('pagehide', () => {
                flushLocalDraftSync();
                sendKeepaliveCloudFlush();
            });

            window.addEventListener('beforeunload', (event) => {
                flushLocalDraftSync();
                const online = typeof navigator === 'undefined' || navigator.onLine !== false;
                if (currentUser && isDocumentReady && (isSavingToCloud || (hasUnsavedChanges && online))) {
                    sendKeepaliveCloudFlush();
                    event.preventDefault();
                    event.returnValue = '';
                }
            });

            window.addEventListener('focus', () => {
                checkCloudUpdatesOnFocus();
            });

            window.addEventListener('online', () => {
                if (!currentUser || !isDocumentReady || hasUnresolvedConflict) return;
                if (needsCloudReconcile) {
                    reconcileCloudAfterOffline();
                } else if (hasUnsavedChanges) {
                    flushCloudSave();
                }
            });

            window.addEventListener('offline', () => {
                if (currentUser && isDocumentReady) {
                    setStatus(hasUnsavedChanges ? 'Offline — saved locally, will sync when online' : 'Offline mode');
                }
            });

            // Cross-tab local storage sync in the same browser
            window.addEventListener('storage', (event) => {
                if (!currentUser || !isDocumentReady || hasUnresolvedConflict) return;
                if (event.key === getLocalMetaKey(currentUser.id) && !hasUnsavedChanges && !isSavingToCloud) {
                    const snap = readLocalSnapshot(currentUser.id);
                    if (snap.content !== null && snap.content !== editor.value && snap.meta && !snap.meta.dirty) {
                        lastSyncedContent = snap.content;
                        lastSyncedAt = snap.meta.syncedAt || lastSyncedAt;
                        docRevision++;
                        editor.value = snap.content;
                        schedulePreviewRender({ immediate: false });
                        setStatus('Synced from another tab');
                    }
                }
            });

            exportBtn.addEventListener('click', exportPreviewAsPng);

            document.addEventListener('keydown', (event) => {
                if (event.key === 'Escape' && !pdfModalBackdrop.hidden && !exportingPdf) {
                    event.preventDefault();
                    closePdfModal();
                    return;
                }

                if ((event.ctrlKey || event.metaKey) && !event.altKey && !event.shiftKey && event.key.toLowerCase() === 's') {
                    event.preventDefault();
                    if (currentUser && !document.body.classList.contains('signed-out')) {
                        if (hasUnsavedChanges && !hasUnresolvedConflict) {
                            flushCloudSave();
                        }
                        exportPreviewAsPng();
                    }
                }
            });
        })();
    </script>
</body>
</html>
