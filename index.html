<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Text &amp; LaTeX Editor</title>

    <!-- KaTeX CSS & JS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.19.0/dist/katex.min.css" integrity="sha384-3rdsX6e5mueWyoweR9NIVmtEsUkokpBT/0ALqKKIBMr9j4qhHkaIkAcGgsE6uVlp" crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.19.0/dist/katex.min.js" integrity="sha384-QFFtAGzvvj+bfgCGxXJlNZZR1nXEZgvG8tDLCCY1F19xl20WlfTYgguB4VcNdxYk" crossorigin="anonymous"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.19.0/dist/contrib/auto-render.min.js" integrity="sha384-bjyGPfbij8/NDKJhSGZNP/khQVgtHUE5exjm4Ydllo42FwIgYsdLO2lXGmRBf5Mz" crossorigin="anonymous"></script>

    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Editor & UI Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800&family=JetBrains+Mono&display=swap" rel="stylesheet">

    <!-- Theme + Font Bootstrap (runs before first paint to prevent theme/font flash) -->
    <script>
        (function () {
            var FONTS = {
                nunito:    { label: 'Nunito ExtraBold', family: "'Nunito', Verdana, sans-serif", weight: '800' },
                verdana:   { label: 'Verdana',          family: 'Verdana, Geneva, sans-serif', weight: '400' },
                helvetica: { label: 'Helvetica',        family: 'Helvetica, Arial, sans-serif', weight: '400' },
                jetbrains: { label: 'JetBrains Mono',   family: "'JetBrains Mono', Consolas, monospace", weight: '400' },
                calibri:   { label: 'Calibri',          family: "Calibri, Carlito, 'Segoe UI', sans-serif", weight: '400' },
                arial:     { label: 'Arial',            family: 'Arial, Helvetica, sans-serif', weight: '400' },
                consolas:  { label: 'Consolas',         family: "Consolas, 'Liberation Mono', 'Courier New', monospace", weight: '400' }
            };

            function safeGet(key) {
                try {
                    return localStorage.getItem(key);
                } catch (e) {
                    return null;
                }
            }

            window.LATEX_EDITOR_FONTS = FONTS;
            window.applyEditorFont = function (key) {
                var f = FONTS[key] || FONTS.nunito;
                document.documentElement.style.setProperty('--app-font', f.family);
                document.documentElement.style.setProperty('--app-font-weight', f.weight);
            };

            var theme = safeGet('latex_editor_theme');
            if (theme !== 'light' && theme !== 'dark') {
                theme = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
                    ? 'dark'
                    : 'light';
            }
            document.documentElement.setAttribute('data-theme', theme);

            var fontKey = safeGet('latex_editor_font');
            window.applyEditorFont(FONTS[fontKey] ? fontKey : 'nunito');
        })();
    </script>

    <style>
        /* ---- Theme Variables ---- */
        :root {
            color-scheme: light;
            --bg: #ffffff;
            --text: #333333;
            --editor-bg: #fafafa;
            --preview-bg: #ffffff;
            --border: #dddddd;
            --toolbar-bg: #f5f5f5;
            --btn-bg: #ffffff;
            --btn-border: #cccccc;
            --btn-hover-bg: #efefef;
            --btn-hover-border: #bbbbbb;
            --btn-text: #333333;
            --accent-bg: #2563eb;
            --accent-hover: #1d4ed8;
            --accent-text: #ffffff;
            --active-pill-bg: #e8f1ff;
            --active-pill-border: #93c5fd;
            --active-pill-text: #1d4ed8;
            --warn-bg: #fef3c7;
            --warn-border: #f59e0b;
            --warn-text: #78350f;
            --hint-text: #999999;
            --status-text: #888888;
            --status-bg: rgba(255, 255, 255, 0.85);
            --placeholder: #aaaaaa;
            --ghost-text: #a3a3a3;
            --modal-backdrop: rgba(15, 23, 42, 0.42);
            --shadow: 0 12px 36px rgba(0, 0, 0, 0.16);
            --app-font: 'Nunito', Verdana, sans-serif;
            --app-font-weight: 800;
        }

        :root[data-theme="dark"] {
            color-scheme: dark;
            --bg: #1e1e1e;
            --text: #d4d4d4;
            --editor-bg: #1e1e1e;
            --preview-bg: #212121;
            --border: #3a3a3a;
            --toolbar-bg: #252525;
            --btn-bg: #2d2d2d;
            --btn-border: #484848;
            --btn-hover-bg: #383838;
            --btn-hover-border: #5c5c5c;
            --btn-text: #d4d4d4;
            --accent-bg: #3b82f6;
            --accent-hover: #2563eb;
            --accent-text: #ffffff;
            --active-pill-bg: #1e3a5f;
            --active-pill-border: #3b82f6;
            --active-pill-text: #93c5fd;
            --warn-bg: #3a2b10;
            --warn-border: #b45309;
            --warn-text: #fde68a;
            --hint-text: #808080;
            --status-text: #9a9a9a;
            --status-bg: rgba(30, 30, 30, 0.88);
            --placeholder: #6a6a6a;
            --ghost-text: #686868;
            --modal-backdrop: rgba(0, 0, 0, 0.58);
            --shadow: 0 16px 44px rgba(0, 0, 0, 0.48);
        }

        /* ---- Base Layout ---- */
        body {
            font-family: var(--app-font);
            font-weight: var(--app-font-weight);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            color: var(--text);
            background: var(--bg);
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        body.signed-out > .toolbar,
        body.signed-out > .main,
        body.signed-out > .status {
            display: none;
        }

        .main {
            flex: 1;
            display: flex;
            min-height: 0;
        }

        .pane {
            flex: 1;
            height: 100%;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            min-width: 0;
            position: relative;
        }

        /* ---- Toolbar ---- */
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px 10px;
            padding: 10px 14px;
            border-bottom: 1px solid var(--border);
            background: var(--toolbar-bg);
            flex: none;
            font-family: var(--app-font);
            font-weight: var(--app-font-weight);
            transition: background-color 0.25s ease, border-color 0.25s ease;
        }

        .toolbar button {
            font-family: var(--app-font);
            font-weight: var(--app-font-weight);
            font-size: 13px;
            padding: 6px 13px;
            border: 1px solid var(--btn-border);
            border-radius: 6px;
            background: var(--btn-bg);
            color: var(--btn-text);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: background-color 0.15s ease, border-color 0.15s ease, color 0.25s ease;
        }

        .toolbar button:hover:not(:disabled) {
            background: var(--btn-hover-bg);
            border-color: var(--btn-hover-border);
        }

        .toolbar button:disabled {
            opacity: 0.5;
            cursor: default;
        }

        .toolbar button.is-toggle-on {
            background: var(--active-pill-bg);
            border-color: var(--active-pill-border);
            color: var(--active-pill-text);
        }

        .toolbar-divider {
            width: 1px;
            height: 20px;
            background: var(--border);
            margin: 0 2px;
        }

        .kbd-hint {
            font-size: 12px;
            color: var(--hint-text);
        }

        .toolbar .spacer {
            flex: 1;
        }

        .font-label {
            font-size: 13px;
            color: var(--hint-text);
        }

        .toolbar select {
            font-family: var(--app-font);
            font-weight: var(--app-font-weight);
            font-size: 13px;
            padding: 5px 8px;
            border: 1px solid var(--btn-border);
            border-radius: 6px;
            background: var(--btn-bg);
            color: var(--btn-text);
            cursor: pointer;
            max-width: 220px;
        }

        .toolbar select:hover {
            border-color: var(--btn-hover-border);
        }

        #themeToggle {
            width: 30px;
            height: 30px;
            padding: 0;
            justify-content: center;
        }

        #themeToggle svg {
            display: block;
        }

        #iconSun {
            display: none;
        }

        :root[data-theme="dark"] #iconMoon {
            display: none;
        }

        :root[data-theme="dark"] #iconSun {
            display: block;
        }

        /* ---- Pane Banners (Conflict / Offline / Render Paused) ---- */
        .pane-banner {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px 12px;
            padding: 8px 14px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-weight: 500;
            font-size: 13px;
            border-bottom: 1px solid var(--border);
            background: var(--toolbar-bg);
            color: var(--text);
            flex: none;
        }

        .pane-banner[hidden] {
            display: none;
        }

        .pane-banner.is-warn {
            background: var(--warn-bg);
            border-bottom-color: var(--warn-border);
            color: var(--warn-text);
        }

        .pane-banner .banner-text {
            flex: 1;
            min-width: 180px;
        }

        .pane-banner button {
            font: inherit;
            font-size: 12px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 5px;
            border: 1px solid var(--btn-border);
            background: var(--btn-bg);
            color: var(--btn-text);
            cursor: pointer;
        }

        .pane-banner button:hover {
            background: var(--btn-hover-bg);
        }

        .pane-banner button.is-primary {
            background: var(--accent-bg);
            border-color: var(--accent-bg);
            color: var(--accent-text);
        }

        .pane-banner button.is-primary:hover {
            background: var(--accent-hover);
        }

        /* ---- Editor & Preview ---- */
        .editor-wrap {
            position: relative;
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        textarea {
            width: 100%;
            flex: 1;
            min-height: 0;
            border: none;
            padding: 20px;
            font-size: 16px;
            line-height: 1.5;
            resize: none;
            outline: none;
            background-color: var(--editor-bg);
            color: var(--text);
            font-family: var(--app-font);
            font-weight: var(--app-font-weight);
            box-sizing: border-box;
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        textarea::placeholder {
            color: var(--placeholder);
            opacity: 1;
        }

        /* Inline Gray Autocomplete Ghost */
        #mathGhost {
            position: absolute;
            pointer-events: none;
            z-index: 3;
            font-family: var(--app-font);
            font-weight: var(--app-font-weight);
            font-size: 16px;
            line-height: 1.5;
            color: var(--ghost-text);
            white-space: nowrap;
            overflow: hidden;
            user-select: none;
        }

        #mathGhost[hidden] {
            display: none;
        }

        #caretMirror {
            position: fixed;
            top: -99999px;
            left: -99999px;
            visibility: hidden;
            pointer-events: none;
            white-space: pre-wrap;
            word-wrap: break-word;
            overflow-wrap: break-word;
            box-sizing: border-box;
        }

        /* Floating Command Preview Popup */
        #mathSuggest {
            position: fixed;
            z-index: 5000;
            min-width: 250px;
            max-width: 350px;
            background: var(--toolbar-bg);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 9px;
            box-shadow: var(--shadow);
            padding: 5px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-weight: 400;
            user-select: none;
        }

        #mathSuggest[hidden] {
            display: none;
        }

        .math-suggest-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 3px 8px 5px;
            font-size: 11px;
            color: var(--hint-text);
            border-bottom: 1px solid var(--border);
            margin-bottom: 4px;
        }

        .math-suggest-list {
            display: flex;
            flex-direction: column;
            gap: 2px;
            max-height: 240px;
            overflow-y: auto;
        }

        .math-suggest-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 5px 8px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }

        .math-suggest-item:hover,
        .math-suggest-item.is-active {
            background: var(--btn-hover-bg);
        }

        .math-suggest-item.is-active {
            outline: 1px solid var(--btn-border);
        }

        .math-suggest-glyph {
            width: 26px;
            height: 24px;
            flex: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 5px;
            background: var(--btn-bg);
            border: 1px solid var(--border);
            font-family: "Cambria Math", "STIX Two Math", "Times New Roman", serif;
            font-size: 14px;
            color: var(--text);
        }

        .math-suggest-body {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 1px;
        }

        .math-suggest-cmd {
            font-family: "JetBrains Mono", Consolas, monospace;
            font-size: 12.5px;
            font-weight: 600;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .math-suggest-rest {
            color: var(--ghost-text);
            font-weight: 400;
        }

        .math-suggest-desc {
            font-size: 11px;
            color: var(--hint-text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .math-suggest-tab {
            flex: none;
            font-size: 10.5px;
            font-weight: 600;
            padding: 2px 5px;
            border-radius: 4px;
            border: 1px solid var(--btn-border);
            background: var(--btn-bg);
            color: var(--hint-text);
        }

        .math-suggest-item:not(.is-active) .math-suggest-tab {
            display: none;
        }

        .preview-surface {
            padding: 20px;
            overflow-y: auto;
            border-left: 1px solid var(--border);
            white-space: pre-wrap;
            font-size: 16px;
            line-height: 1.6;
            flex: 1;
            min-height: 0;
            box-sizing: border-box;
            background: var(--preview-bg);
            color: var(--text);
            /* The rendered preview keeps a neutral font independent of the editor font */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-weight: 400;
            transition: background-color 0.25s ease, color 0.25s ease, border-color 0.25s ease;
        }

        .preview-block {
            display: inline;
        }

        /* ---- Status Badge ---- */
        .status {
            position: fixed;
            bottom: 10px;
            right: 20px;
            font-size: 12px;
            color: var(--status-text);
            background: var(--status-bg);
            padding: 3px 8px;
            border-radius: 5px;
            border: 1px solid transparent;
            font-family: var(--app-font);
            font-weight: var(--app-font-weight);
            transition: background-color 0.25s ease, color 0.25s ease;
            z-index: 100;
            pointer-events: none;
        }

        /* ---- PDF Export Modal (Blurred Background) ---- */
        #pdfModalBackdrop {
            position: fixed;
            inset: 0;
            z-index: 9000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
            background: var(--modal-backdrop);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        #pdfModalBackdrop[hidden] {
            display: none;
        }

        #pdfModal {
            width: 100%;
            max-width: 440px;
            background: var(--bg);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: var(--shadow);
            padding: 18px 20px 20px;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-weight: 400;
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
        }

        .modal-header h3 {
            margin: 0;
            font-size: 16px;
            font-weight: 700;
        }

        .modal-close {
            width: 28px;
            height: 28px;
            border: 1px solid transparent;
            border-radius: 6px;
            background: transparent;
            color: var(--hint-text);
            font-size: 18px;
            line-height: 1;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .modal-close:hover {
            background: var(--btn-hover-bg);
            color: var(--text);
        }

        .pdf-form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 11px 12px;
        }

        .pdf-field {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .pdf-field.is-full {
            grid-column: 1 / -1;
        }

        .pdf-field label {
            font-size: 12px;
            font-weight: 600;
            color: var(--hint-text);
        }

        .pdf-field input[type="text"],
        .pdf-field select {
            font: inherit;
            font-size: 13px;
            padding: 7px 9px;
            border: 1px solid var(--btn-border);
            border-radius: 6px;
            background: var(--editor-bg);
            color: var(--text);
            box-sizing: border-box;
            width: 100%;
        }

        .pdf-checkbox-row {
            grid-column: 1 / -1;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            margin-top: 2px;
            cursor: pointer;
            user-select: none;
        }

        .pdf-summary {
            margin: 12px 0 0;
            padding: 8px 10px;
            border-radius: 6px;
            background: var(--toolbar-bg);
            border: 1px solid var(--border);
            font-size: 12px;
            color: var(--hint-text);
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 9px;
            margin-top: 16px;
        }

        .modal-footer button {
            font: inherit;
            font-size: 13px;
            font-weight: 600;
            padding: 8px 15px;
            border-radius: 7px;
            border: 1px solid var(--btn-border);
            background: var(--btn-bg);
            color: var(--btn-text);
            cursor: pointer;
        }

        .modal-footer button:hover:not(:disabled) {
            background: var(--btn-hover-bg);
        }

        .modal-footer button.is-primary {
            background: var(--accent-bg);
            border-color: var(--accent-bg);
            color: var(--accent-text);
        }

        .modal-footer button.is-primary:hover:not(:disabled) {
            background: var(--accent-hover);
        }

        .modal-footer button:disabled {
            opacity: 0.55;
            cursor: default;
        }

        /* ---- Auth Overlay ---- */
        #authPanel {
            position: fixed;
            inset: 0;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: var(--bg);
            color: var(--text);
            padding: 24px;
            box-sizing: border-box;
        }

        #authPanel[hidden] {
            display: none;
        }

        #authPanel h2 {
            margin: 0 0 8px;
        }

        #authPanel > p {
            margin: 0 0 20px;
            color: var(--hint-text);
        }

        #authPanel form {
            width: 100%;
            max-width: 340px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        #authPanel input {
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--editor-bg);
            color: var(--text);
            font: inherit;
        }

        #authPanel button {
            padding: 11px;
            border: 1px solid var(--btn-border);
            border-radius: 8px;
            background: var(--btn-bg);
            color: var(--btn-text);
            font: inherit;
            cursor: pointer;
            transition: background-color 0.15s ease, border-color 0.15s ease;
        }

        #authPanel button:hover:not(:disabled) {
            background: var(--btn-hover-bg);
            border-color: var(--btn-hover-border);
        }

        #authPanel button:disabled {
            opacity: 0.5;
            cursor: default;
        }

        #authMessage {
            margin: 4px 0 0;
            min-height: 1.2em;
            font-size: 13px;
            text-align: center;
        }
    </style>
</head>
<body class="signed-out">
    <!-- Auth Panel -->
    <div id="authPanel" hidden>
        <h2>Welcome to LaTeX Notebook</h2>
        <p>Sign in to access your notebook</p>

        <form id="authForm">
            <input
                type="email"
                id="authEmail"
                placeholder="Email address"
                autocomplete="email"
                required
            >
            <input
                type="password"
                id="authPassword"
                placeholder="Password"
                minlength="8"
                autocomplete="current-password"
                required
            >
            <button type="submit" id="signInBtn">Sign In</button>
            <button type="button" id="signUpBtn">Create Account</button>
            <p id="authMessage" role="status"></p>
        </form>
    </div>

    <!-- Top Toolbar -->
    <div class="toolbar">
        <button id="exportBtn" type="button" title="Export all text and rendered equations in the right preview as one high-resolution PNG">
            Export preview as PNG
        </button>
        <span class="kbd-hint">or press Ctrl&nbsp;+&nbsp;S</span>
        <button id="exportPdfBtn" type="button" title="Configure and export your rendered document as a PDF">
            Export PDF
        </button>

        <span class="toolbar-divider" aria-hidden="true"></span>

        <button id="renderToggleBtn" type="button" class="is-toggle-on" aria-pressed="true" title="Toggle live LaTeX rendering in the preview pane">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
            </svg>
            <span id="renderToggleLabel">Render: On</span>
        </button>

        <span class="spacer"></span>

            /* ============================================================
               5. Optimized Incremental + Time-Sliced Preview Renderer
               ============================================================ */
            let isRenderEnabled = safeStorageGet(STORAGE_RENDER_KEY) !== 'false';
            let renderedBlocks = []; // Array<{ text: string, el: HTMLElement }>
            let renderDebounceTimer = null;
            let renderRafId = null;
            let renderGeneration = 0;

            const katexCache = new Map();

            function getCachedKatexHtml(expr, displayMode) {
                const key = (displayMode ? 'D:' : 'I:') + expr;
                if (katexCache.has(key)) {
                    const cached = katexCache.get(key);
                    // Refresh LRU position
                    katexCache.delete(key);
                    katexCache.set(key, cached);
                    return cached;
                }

                const html = window.katex.renderToString(expr, {
                    displayMode: displayMode,
                    throwOnError: false
                });
                katexCache.set(key, html);

                if (katexCache.size > KATEX_CACHE_LIMIT) {
                    const oldestKey = katexCache.keys().next().value;
                    katexCache.delete(oldestKey);
                }
                return html;
            }

            function findEndOfMath(delimiter, text, startIndex) {
                let index = startIndex;
                let braceLevel = 0;

                while (index < text.length) {
                    const ch = text[index];
                    if (braceLevel <= 0 && text.startsWith(delimiter, index)) {
                        return index;
                    }
                    if (ch === '\\') {
                        index += 2;
                        continue;
                    }
                    if (ch === '{') {
                        braceLevel++;
                    } else if (ch === '}') {
                        braceLevel--;
                    }
                    index++;
                }
                return -1;
            }

            function isEscapedAt(text, pos) {
                let backslashes = 0;
                for (let i = pos - 1; i >= 0 && text.charCodeAt(i) === 92; i--) {
                    backslashes++;
                }
                return (backslashes & 1) === 1;
            }

            function buildRenderedFragment(blockText) {
                const frag = document.createDocumentFragment();
                if (!blockText) return frag;

                if (!window.katex || typeof window.katex.renderToString !== 'function') {
                    frag.appendChild(document.createTextNode(blockText));
                    return frag;
                }

                let pos = 0;
                let textStart = 0;

                const flushPlain = (end) => {
                    if (end > textStart) {
                        frag.appendChild(document.createTextNode(blockText.slice(textStart, end)));
                    }
                };

                while (pos < blockText.length) {
                    const ch = blockText[pos];

                    if (ch === '$' && !isEscapedAt(blockText, pos)) {
                        const isDisplay = blockText[pos + 1] === '$';
                        const delim = isDisplay ? '$$' : '$';
                        const contentStart = pos + delim.length;
                        const endIdx = findEndOfMath(delim, blockText, contentStart);

                        if (endIdx !== -1) {
                            flushPlain(pos);
                            const expr = blockText.slice(contentStart, endIdx);
                            try {
                                const html = getCachedKatexHtml(expr, isDisplay);
                                const tpl = document.createElement('template');
                                tpl.innerHTML = html;
                                frag.appendChild(tpl.content);
                            } catch (err) {
                                console.error('KaTeX rendering error:', err);
                                frag.appendChild(document.createTextNode(blockText.slice(pos, endIdx + delim.length)));
                            }
                            pos = endIdx + delim.length;
                            textStart = pos;
                            continue;
                        }
                    }
                    pos++;
                }

                flushPlain(blockText.length);
                return frag;
            }

            function createRenderedBlockElement(blockText) {
                const span = document.createElement('span');
                span.className = 'preview-block';
                span.appendChild(buildRenderedFragment(blockText));
                return span;
            }

            function splitDocumentIntoBlocks(text) {
                if (!text) return [];

                const lines = [];
                let lineStart = 0;
                for (let i = 0; i < text.length; i++) {
                    if (text.charCodeAt(i) === 10) {
                        lines.push(text.slice(lineStart, i + 1));
                        lineStart = i + 1;
                    }
                }
                if (lineStart < text.length) {
                    lines.push(text.slice(lineStart));
                }

                const blocks = [];
                let currentLines = [];
                let inDisplay = false;
                let inInline = false;
                let openLines = 0;

                for (let l = 0; l < lines.length; l++) {
                    const line = lines[l];
                    currentLines.push(line);

                    let i = 0;
                    while (i < line.length) {
                        const ch = line.charCodeAt(i);
                        if (ch === 92) { // '\'
                            i += 2;
                            continue;
                        }
                        if (ch === 36) { // '$'
                            if (line.charCodeAt(i + 1) === 36) {
                                if (!inInline) {
                                    inDisplay = !inDisplay;
                                }
                                i += 2;
                                continue;
                            } else if (!inDisplay) {
                                inInline = !inInline;
                            }
                        }
                        i++;
                    }

                    if (inDisplay || inInline) {
                        openLines++;
                        const isBlank = line.trim().length === 0;
                        // Prevent unclosed delimiters from merging the rest of the document
                        if ((inInline && (isBlank || openLines >= 6)) || (inDisplay && isBlank && openLines >= 80)) {
                            inInline = false;
                            if (openLines >= 80) inDisplay = false;
                        }
                    } else {
                        openLines = 0;
                    }

                    if (!inDisplay && !inInline) {
                        blocks.push(currentLines.join(''));
                        currentLines = [];
                        openLines = 0;
                    }
                }

                if (currentLines.length > 0) {
                    blocks.push(currentLines.join(''));
                }

                return blocks;
            }

            function cancelPendingRenderWork() {
                renderGeneration++;
                if (renderDebounceTimer) {
                    clearTimeout(renderDebounceTimer);
                    renderDebounceTimer = null;
                }
                if (renderRafId !== null) {
                    cancelAnimationFrame(renderRafId);
                    renderRafId = null;
                }
            }

            function renderAllSynchronouslyInto(targetEl, text) {
                const blocks = splitDocumentIntoBlocks(text);
                const frag = document.createDocumentFragment();
                for (let i = 0; i < blocks.length; i++) {
                    frag.appendChild(createRenderedBlockElement(blocks[i]));
                }
                targetEl.replaceChildren(frag);
                return blocks;
            }

            function applyIncrementalPreviewRender(text, immediate) {
                cancelPendingRenderWork();
                const thisGen = renderGeneration;

                const executeDiff = () => {
                    if (thisGen !== renderGeneration) return;

                    const newBlocks = splitDocumentIntoBlocks(text);
                    const oldLen = renderedBlocks.length;
                    const newLen = newBlocks.length;

                    let prefix = 0;
                    while (prefix < oldLen && prefix < newLen && renderedBlocks[prefix].text === newBlocks[prefix]) {
                        prefix++;
                    }

                    let oldEnd = oldLen - 1;
                    let newEnd = newLen - 1;
                    while (oldEnd >= prefix && newEnd >= prefix && renderedBlocks[oldEnd].text === newBlocks[newEnd]) {
                        oldEnd--;
                        newEnd--;
                    }

                    const removeCount = oldEnd - prefix + 1;
                    const insertCount = newEnd - prefix + 1;

                    if (removeCount === 0 && insertCount === 0) {
                        return;
                    }

                    // Determine anchor DOM node for the untouched suffix
                    const suffixStartIdx = oldEnd + 1;
                    const anchorNode = suffixStartIdx < renderedBlocks.length
                        ? renderedBlocks[suffixStartIdx].el
                        : null;

                    if (removeCount > 0) {
                        const removed = renderedBlocks.splice(prefix, removeCount);
                        for (let i = 0; i < removed.length; i++) {
                            removed[i].el.remove();
                        }
                    }

                    if (insertCount <= 0) {
                        return;
                    }

                    // Small edits apply immediately in one fragment
                    if (immediate || insertCount <= 16) {
                        const frag = document.createDocumentFragment();
                        const newEntries = [];
                        for (let i = prefix; i <= newEnd; i++) {
                            const blockText = newBlocks[i];
                            const el = createRenderedBlockElement(blockText);
                            frag.appendChild(el);
                            newEntries.push({ text: blockText, el });
                        }
                        preview.insertBefore(frag, anchorNode);
                        renderedBlocks.splice(prefix, 0, ...newEntries);
                        return;
                    }

                    // Large paste / full re-render: time-slice across animation frames
                    let cursor = prefix;
                    let spliceIdx = prefix;

                    const stepSlice = () => {
                        if (thisGen !== renderGeneration) {
                            renderRafId = null;
                            return;
                        }

                        const frameStart = performance.now();
                        const frag = document.createDocumentFragment();
                        const batchEntries = [];

                        while (cursor <= newEnd) {
                            const blockText = newBlocks[cursor];
                            const el = createRenderedBlockElement(blockText);
                            frag.appendChild(el);
                            batchEntries.push({ text: blockText, el });
                            cursor++;

                            if (batchEntries.length >= 12 && (performance.now() - frameStart) >= RENDER_FRAME_BUDGET_MS) {
                                break;
                            }
                        }

                        preview.insertBefore(frag, anchorNode);
                        renderedBlocks.splice(spliceIdx, 0, ...batchEntries);
                        spliceIdx += batchEntries.length;

                        if (cursor <= newEnd) {
                            renderRafId = requestAnimationFrame(stepSlice);
                        } else {
                            renderRafId = null;
                        }
                    };

                    renderRafId = requestAnimationFrame(stepSlice);
                };

                if (immediate) {
                    executeDiff();
                    return;
                }

                const delay = text.length > RENDER_LARGE_DOC_THRESHOLD
                    ? RENDER_LARGE_DEBOUNCE_MS
                    : RENDER_FAST_DEBOUNCE_MS;

                renderDebounceTimer = setTimeout(() => {
                    renderDebounceTimer = null;
                    renderRafId = requestAnimationFrame(() => {
                        renderRafId = null;
                        executeDiff();
                    });
                }, delay);
            }

                cancelPendingRenderWork();
                renderedBlocks = [];

            const MATH_ENVIRONMENTS = new Set([
                'equation', 'equation*', 'align', 'align*', 'aligned', 'gather',

            function isInMathMode(text, cursorPos) {
                let mode = 'text'; // 'text' | 'inline' | 'display' | 'paren' | 'bracket' | 'env'
                let envDepth = 0;
                let i = 0;

                while (i < cursorPos) {
                    const ch = text[i];

                    // Reset unclosed single-$ on blank lines so a stray $5 doesn't lock later paragraphs
                    if (mode === 'inline' && ch === '\n' && text[i + 1] === '\n') {
                        mode = 'text';
                        i += 2;
                        continue;
                    }

                    if (ch === '\\') {
                        const two = text.slice(i, i + 2);
                        if (two === '\\(' && mode === 'text') {
                            mode = 'paren';
                            i += 2;
                            continue;
                        }
                        if (two === '\\)' && mode === 'paren') {
                            mode = 'text';
                            i += 2;
                            continue;
                        }
                        if (two === '\\[' && mode === 'text') {
                            mode = 'bracket';
                            i += 2;
                            continue;
                        }
                        if (two === '\\]' && mode === 'bracket') {
                            mode = 'text';
                            i += 2;
                            continue;
                        }

                        if (text.startsWith('\\begin{', i)) {
                            const closeBrace = text.indexOf('}', i + 7);
                            if (closeBrace !== -1 && closeBrace < cursorPos) {
                                const envName = text.slice(i + 7, closeBrace);
                                if (MATH_ENVIRONMENTS.has(envName)) {
                                    if (mode === 'text') mode = 'env';
                                    envDepth++;
                                }
                                i = closeBrace + 1;
                                continue;
                            }
                        }

                        if (text.startsWith('\\end{', i)) {
                            const closeBrace = text.indexOf('}', i + 5);
                            if (closeBrace !== -1 && closeBrace < cursorPos) {
                                const envName = text.slice(i + 5, closeBrace);
                                if (MATH_ENVIRONMENTS.has(envName) && envDepth > 0) {
                                    envDepth--;
                                    if (envDepth === 0 && mode === 'env') {
                                        mode = 'text';
                                    }
                                }
                                i = closeBrace + 1;
                                continue;
                            }
                        }

                        i += 2;
                        continue;
                    }

                    if (ch === '$') {
                        if (text[i + 1] === '$') {
                            if (mode === 'display') {
                                mode = 'text';
                            } else if (mode === 'text') {
                                mode = 'display';
                            }
                            i += 2;
                            continue;
                        }
                        if (mode === 'inline') {
                            mode = 'text';
                        } else if (mode === 'text') {
                            mode = 'inline';
                        }

                        continue;
                    }
