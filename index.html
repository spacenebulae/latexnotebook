                const afterSnippet = value.slice(caretPos, caretPos + 24) || '\u200b';

                const marker = document.createElement('span');
                marker.textContent = '\u200b';

                caretMirror.replaceChildren(
                    document.createTextNode(beforeText),
                    marker,
                    document.createTextNode(afterSnippet)
                );

                const lineH = parseFloat(cs.lineHeight) || (parseFloat(cs.fontSize) * 1.5);
                const lineTop = marker.offsetTop - Math.max(0, (lineH - marker.offsetHeight) / 2);

                return {
                    x: marker.offsetLeft - editor.scrollLeft,
                    y: lineTop - editor.scrollTop,
                    lineHeight: lineH,
                    paddingRight: parseFloat(cs.paddingRight) || 20
                };
            }

            function hideAutocomplete() {
                acState.active = false;
                acState.matches = [];
                acState.selectedIndex = 0;
                mathGhost.hidden = true;
                mathGhost.textContent = '';
                mathSuggest.hidden = true;
                mathSuggestList.replaceChildren();
            }

            function renderAutocompleteUI() {
                if (!acState.active || acState.matches.length === 0) {
                    hideAutocomplete();
                    return;
                }

                const caretPos = editor.selectionStart;
                const coords = measureCaretCoordinates(caretPos);

                // Hide if caret is scrolled out of the editor viewport
                if (coords.y < -4 || coords.y + coords.lineHeight > editor.clientHeight + 8) {
                    mathGhost.hidden = true;
                    mathSuggest.hidden = true;
                    return;
                }

                const activeEntry = acState.matches[acState.selectedIndex] || acState.matches[0];
                const token = acState.token;

                // 1. Gray Inline Ghost Text (when >=1 char typed after '\' and cursor sits before space/newline/EOF)
                const nextChar = editor.value[caretPos];
                const isClearAfterCursor = !nextChar || /\s/.test(nextChar);
                let ghostSuffix = '';
                if (token.length > 1 && activeEntry.insert.startsWith(token)) {
                    ghostSuffix = activeEntry.insert.slice(token.length);
                }

                if (ghostSuffix && isClearAfterCursor && !ghostSuffix.includes('\n')) {
                    const maxGhostWidth = Math.max(0, editor.clientWidth - coords.x - coords.paddingRight);
                    if (maxGhostWidth > 8) {
                        mathGhost.textContent = ghostSuffix;
                        mathGhost.style.left = coords.x + 'px';
                        mathGhost.style.top = coords.y + 'px';
                        mathGhost.style.maxWidth = maxGhostWidth + 'px';
                        mathGhost.hidden = false;
                    } else {
                        mathGhost.hidden = true;
                    }
                } else {
                    mathGhost.hidden = true;
                }

                // 2. Floating Preview of Possible Commands
                const listFrag = document.createDocumentFragment();
                for (let i = 0; i < acState.matches.length; i++) {
                    const item = acState.matches[i];
                    const row = document.createElement('div');
                    row.className = 'math-suggest-item' + (i === acState.selectedIndex ? ' is-active' : '');
                    row.setAttribute('role', 'option');
                    row.setAttribute('aria-selected', String(i === acState.selectedIndex));

                    const glyph = document.createElement('span');
                    glyph.className = 'math-suggest-glyph';
                    glyph.textContent = item.glyph;

                    const body = document.createElement('div');
                    body.className = 'math-suggest-body';

                    const cmdEl = document.createElement('div');
                    cmdEl.className = 'math-suggest-cmd';
                    const displayCmd = item.insert.replace(/\n+/g, ' … ');
                    if (displayCmd.startsWith(token)) {
                        cmdEl.appendChild(document.createTextNode(token));
                        const rest = document.createElement('span');
                        rest.className = 'math-suggest-rest';
                        rest.textContent = displayCmd.slice(token.length);
                        cmdEl.appendChild(rest);
                    } else {
                        cmdEl.textContent = displayCmd;
                    }

                    const descEl = document.createElement('div');
                    descEl.className = 'math-suggest-desc';
                    descEl.textContent = item.desc;

                    body.appendChild(cmdEl);
                    body.appendChild(descEl);

                    const tabBadge = document.createElement('span');
                    tabBadge.className = 'math-suggest-tab';
                    tabBadge.textContent = 'Tab';

                    row.appendChild(glyph);
                    row.appendChild(body);
                    row.appendChild(tabBadge);

                    row.addEventListener('mousedown', (event) => {
                        event.preventDefault();
                        acceptAutocomplete(i);
                    });

                    listFrag.appendChild(row);
                }

                mathSuggestList.replaceChildren(listFrag);
                mathSuggest.hidden = false;

                // Position popup cleanly inside viewport
                const editorRect = editor.getBoundingClientRect();
                const popupRect = mathSuggest.getBoundingClientRect();

                let left = editorRect.left + coords.x;
                if (left + popupRect.width > window.innerWidth - 10) {
                    left = Math.max(10, window.innerWidth - popupRect.width - 10);
                }
                left = Math.max(10, left);

                let top = editorRect.top + coords.y + coords.lineHeight + 5;
                if (top + popupRect.height > window.innerHeight - 10) {
                    const aboveTop = editorRect.top + coords.y - popupRect.height - 5;
                    if (aboveTop >= 10) {
                        top = aboveTop;
                    }
                }

                mathSuggest.style.left = left + 'px';
                mathSuggest.style.top = top + 'px';

                const activeRow = mathSuggestList.children[acState.selectedIndex];
                if (activeRow) {
                    activeRow.scrollIntoView({ block: 'nearest' });
                }
            }

            function updateAutocomplete() {
                if (!currentUser || document.body.classList.contains('signed-out') || editor.readOnly) {
                    hideAutocomplete();
                    return;
                }

                if (document.activeElement !== editor) {
                    hideAutocomplete();
                    return;
                }

                const start = editor.selectionStart;
                const end = editor.selectionEnd;
                if (start !== end) {
                    hideAutocomplete();
                    return;
                }

                const text = editor.value;
                if (!isInMathMode(text, start)) {
                    acState.dismissedForTokenAt = null;
                    hideAutocomplete();
                    return;
                }

                const found = findCommandTokenBeforeCaret(text, start);
                if (!found) {
                    acState.dismissedForTokenAt = null;
                    hideAutocomplete();
                    return;
                }

                const dismissSig = found.tokenStart + ':' + found.token;
                if (acState.dismissedForTokenAt === dismissSig) {
                    hideAutocomplete();
                    return;
                }
                acState.dismissedForTokenAt = null;

                const matches = rankAndMatchCommands(found.token);
                if (matches.length === 0) {
                    hideAutocomplete();
                    return;
                }

                // Preserve highlight if user is continuing to narrow the same token
                let nextIndex = 0;
                if (acState.active && acState.tokenStart === found.tokenStart && acState.matches[acState.selectedIndex]) {
                    const prevCmd = acState.matches[acState.selectedIndex].cmd;
                    const idx = matches.findIndex((m) => m.cmd === prevCmd);
                    if (idx !== -1) nextIndex = idx;
                }

                acState.active = true;
                acState.tokenStart = found.tokenStart;
                acState.token = found.token;
                acState.matches = matches;
                acState.selectedIndex = nextIndex;

                renderAutocompleteUI();
            }

            function acceptAutocomplete(indexOverride) {
                if (!acState.active || acState.matches.length === 0) return false;

                const idx = typeof indexOverride === 'number' ? indexOverride : acState.selectedIndex;
                const chosen = acState.matches[idx] || acState.matches[0];
                if (!chosen) return false;

                const caretPos = editor.selectionStart;
                const tokenStart = acState.tokenStart;
                const insertText = chosen.insert;
                const newCaretPos = tokenStart + insertText.length - (chosen.cursorBack || 0);

                editor.focus();
                editor.setSelectionRange(tokenStart, caretPos);

                let insertedViaExec = false;
                try {
                    insertedViaExec = document.execCommand('insertText', false, insertText);
                } catch (e) {
                    insertedViaExec = false;
                }
                if (!insertedViaExec) {
                    editor.setRangeText(insertText, tokenStart, caretPos, 'end');
                }

                editor.setSelectionRange(newCaretPos, newCaretPos);
                commandUsageBoost.set(chosen.cmd, Math.min(30, (commandUsageBoost.get(chosen.cmd) || 0) + 5));

                hideAutocomplete();
                onEditorContentChanged();
                return true;
            }

            /* ============================================================
               7. Airtight Local + Cloud Document Sync
               ============================================================ */
            let currentUser = null;
            let activeUserId = null;
            let latestAccessToken = null;
            let documentLoadId = 0;

            let isDocumentReady = false;
            let hasUnsavedChanges = false;
            let hasUnresolvedConflict = false;
            let needsCloudReconcile = false;
            let docRevision = 0;
            let lastSyncedContent = null;
            let lastSyncedAt = null;

            let localSaveTimer = null;
            let cloudSaveTimer = null;
            let retryTimer = null;
            let retryAttempt = 0;
            let isSavingToCloud = false;
            let resaveQueued = false;
            let activeSavePromise = null;
            let lastFocusSyncCheckAt = 0;

            function setStatus(text, titleText) {
                status.textContent = text;
                status.title = titleText || text;
            }

            function clearAllSaveTimers() {
                if (localSaveTimer) {
                    clearTimeout(localSaveTimer);
                    localSaveTimer = null;
                }
                if (cloudSaveTimer) {
                    clearTimeout(cloudSaveTimer);
                    cloudSaveTimer = null;
                }
                if (retryTimer) {
                    clearTimeout(retryTimer);
                    retryTimer = null;
                }
            }

            function hideSyncBanner() {
                syncBanner.hidden = true;
                syncBanner.replaceChildren();
            }

            function showCloudRetryBanner(message) {
                syncBanner.replaceChildren();
                syncBanner.className = 'pane-banner is-warn';

                const textEl = document.createElement('span');
                textEl.className = 'banner-text';
                textEl.textContent = message;

                const retryBtn = document.createElement('button');
                retryBtn.type = 'button';
                retryBtn.className = 'is-primary';
                retryBtn.textContent = 'Retry Cloud Load';
                retryBtn.addEventListener('click', () => {
                    if (currentUser) loadUserDocument(currentUser);
                });

                syncBanner.appendChild(textEl);
                syncBanner.appendChild(retryBtn);
                syncBanner.hidden = false;
            }

            function showConflictBanner(cloudContent, localContent, cloudUpdatedAt) {
                hasUnresolvedConflict = true;
                syncBanner.replaceChildren();
                syncBanner.className = 'pane-banner is-warn';

                const textEl = document.createElement('span');
                textEl.className = 'banner-text';
                textEl.textContent = 'Local unsaved edits differ from a newer cloud version. Choose how to resolve without losing work:';

                const keepLocalBtn = document.createElement('button');
                keepLocalBtn.type = 'button';
                keepLocalBtn.className = 'is-primary';
                keepLocalBtn.textContent = 'Keep Local & Sync';
                keepLocalBtn.addEventListener('click', () => {
                    if (!currentUser) return;
                    hasUnresolvedConflict = false;
                    hasUnsavedChanges = true;
                    docRevision++;
                    hideSyncBanner();
                    flushCloudSave();
                });

                const useCloudBtn = document.createElement('button');
                useCloudBtn.type = 'button';
                useCloudBtn.textContent = 'Use Cloud Version';
                useCloudBtn.addEventListener('click', () => {
                    if (!currentUser) return;
                    // Save a safety copy of the discarded local draft just in case
                    safeStorageSet('latex_editor_conflict_backup_' + currentUser.id, localContent);
                    hasUnresolvedConflict = false;
                    hasUnsavedChanges = false;
                    lastSyncedContent = cloudContent;
                    lastSyncedAt = cloudUpdatedAt || new Date().toISOString();
                    docRevision++;
                    editor.value = cloudContent;
                    writeLocalSnapshot(currentUser.id, cloudContent, {
                        dirty: false,
                        updatedAt: lastSyncedAt,
                        syncedContent: cloudContent,
                        syncedAt: lastSyncedAt
                    });
                    hideSyncBanner();
                    applyIncrementalPreviewRender(cloudContent, true);
                    setStatus('Loaded cloud version (local backup saved)');
                });

                const mergeBothBtn = document.createElement('button');
                mergeBothBtn.type = 'button';
                mergeBothBtn.textContent = 'Keep Both';
                mergeBothBtn.addEventListener('click', () => {
                    if (!currentUser) return;
                    const merged = localContent + '\n\n--- Cloud Version ---\n\n' + cloudContent;
                    hasUnresolvedConflict = false;
                    hasUnsavedChanges = true;
                    docRevision++;
                    editor.value = merged;
                    hideSyncBanner();
                    applyIncrementalPreviewRender(merged, true);
                    flushCloudSave();
                });

                syncBanner.appendChild(textEl);
                syncBanner.appendChild(keepLocalBtn);
                syncBanner.appendChild(useCloudBtn);
                syncBanner.appendChild(mergeBothBtn);
                syncBanner.hidden = false;
            }

            function isAuthOrJwtError(error) {
                if (!error) return false;
                const msg = String(error.message || '').toLowerCase();
                const code = String(error.code || '');
                return error.status === 401 || code === 'PGRST301' || msg.includes('jwt') || msg.includes('expired') || msg.includes('unauthorized');
            }

            async function selectCloudDocumentWithAuthRetry(userId) {
                let res = await supabaseClient
                    .from('documents')
                    .select('content, updated_at')
                    .eq('user_id', userId)
                    .maybeSingle();

                if (res.error && isAuthOrJwtError(res.error)) {
                    const { data: refreshed, error: refreshErr } = await supabaseClient.auth.refreshSession();
                    if (!refreshErr && refreshed?.session) {
                        latestAccessToken = refreshed.session.access_token || latestAccessToken;
                        res = await supabaseClient
                            .from('documents')
                            .select('content, updated_at')
                            .eq('user_id', userId)
                            .maybeSingle();
                    }
                }

                if (res.error) throw res.error;
                return res.data;
            }

            async function upsertCloudDocumentWithAuthRetry(userId, content, updatedAt) {
                let res = await supabaseClient
                    .from('documents')
                    .upsert({
                        user_id: userId,
                        content: content,
                        updated_at: updatedAt
                    }, {
                        onConflict: 'user_id'
                    });

                if (res.error && isAuthOrJwtError(res.error)) {
                    const { data: refreshed, error: refreshErr } = await supabaseClient.auth.refreshSession();
                    if (!refreshErr && refreshed?.session) {
                        latestAccessToken = refreshed.session.access_token || latestAccessToken;
                        res = await supabaseClient
                            .from('documents')
                            .upsert({
                                user_id: userId,
                                content: content,
                                updated_at: updatedAt
                            }, {
                                onConflict: 'user_id'
                            });
                    }
                }

                if (res.error) throw res.error;
            }

            function flushLocalDraftSync() {
                if (!currentUser || !isDocumentReady || hasUnresolvedConflict) return;
                if (localSaveTimer) {
                    clearTimeout(localSaveTimer);
                    localSaveTimer = null;
                }
                writeLocalSnapshot(currentUser.id, editor.value, {
                    dirty: hasUnsavedChanges || editor.value !== lastSyncedContent,
                    updatedAt: new Date().toISOString()
                });
            }

            function scheduleCloudRetry() {
                if (retryTimer) return;
                const delay = RETRY_DELAYS_MS[Math.min(retryAttempt - 1, RETRY_DELAYS_MS.length - 1)] || 30000;
                retryTimer = setTimeout(() => {
                    retryTimer = null;
                    if (!currentUser || !isDocumentReady || hasUnresolvedConflict) return;
                    if (needsCloudReconcile) {
                        reconcileCloudAfterOffline();
                    } else if (hasUnsavedChanges) {
                        flushCloudSave();
                    }
                }, delay);
            }

            async function flushCloudSave() {
                if (!currentUser || !isDocumentReady || hasUnresolvedConflict) return;

                if (needsCloudReconcile) {
                    await reconcileCloudAfterOffline();
                    if (hasUnresolvedConflict || !hasUnsavedChanges) return;
                }

                if (cloudSaveTimer) {
                    clearTimeout(cloudSaveTimer);
                    cloudSaveTimer = null;
                }

                if (isSavingToCloud) {
                    resaveQueued = true;
                    return activeSavePromise;
                }

                isSavingToCloud = true;
                activeSavePromise = (async () => {
                    try {
                        while (true) {
                            resaveQueued = false;
                            if (!currentUser || !isDocumentReady || hasUnresolvedConflict) break;

                            const userId = currentUser.id;
                            const targetRevision = docRevision;
                            const textToSave = editor.value;
                            const nowIso = new Date().toISOString();

                            writeLocalSnapshot(userId, textToSave, {
                                dirty: true,
                                updatedAt: nowIso
                            });

                            if (textToSave === lastSyncedContent && !hasUnsavedChanges) {
                                writeLocalSnapshot(userId, textToSave, {
                                    dirty: false,
                                    updatedAt: nowIso,
                                    syncedContent: textToSave,
                                    syncedAt: lastSyncedAt || nowIso
                                });
                                setStatus('Saved to cloud', 'Synced at ' + new Date().toLocaleTimeString());
                                break;
                            }

                            setStatus('Saving to cloud...');
                            await upsertCloudDocumentWithAuthRetry(userId, textToSave, nowIso);

                            if (!currentUser || currentUser.id !== userId) break;

                            lastSyncedContent = textToSave;
                            lastSyncedAt = nowIso;
                            retryAttempt = 0;
                            if (retryTimer) {
                                clearTimeout(retryTimer);
                                retryTimer = null;
                            }

                            if (docRevision === targetRevision) {
                                hasUnsavedChanges = false;
                                writeLocalSnapshot(userId, textToSave, {
                                    dirty: false,
                                    updatedAt: nowIso,
                                    syncedContent: textToSave,
                                    syncedAt: nowIso
                                });
                                setStatus('Saved to cloud', 'Synced at ' + new Date().toLocaleTimeString());
                                break;
                            } else {
                                writeLocalSnapshot(userId, editor.value, {
                                    dirty: true,
                                    updatedAt: new Date().toISOString(),
                                    syncedContent: textToSave,
                                    syncedAt: nowIso
                                });
                            }
                        }
                    } catch (error) {
                        retryAttempt++;
                        const isOffline = typeof navigator !== 'undefined' && navigator.onLine === false;
                        if (currentUser) {
                            setStatus(
                                isOffline
                                    ? 'Offline — saved locally, will sync when online'
                                    : 'Cloud save retrying, local copy saved: ' + (error?.message || 'Network error')
                            );
                        }
                        scheduleCloudRetry();
                        console.error('Cloud save failed:', error);
                    } finally {
                        isSavingToCloud = false;
                        activeSavePromise = null;
                        if (resaveQueued && currentUser && isDocumentReady && !hasUnresolvedConflict) {
                            flushCloudSave();
                        }
                    }
                })();

                return activeSavePromise;
            }

            async function reconcileCloudAfterOffline() {
                if (!currentUser || !isDocumentReady || !needsCloudReconcile) return;
                const userId = currentUser.id;
                const revBefore = docRevision;

                try {
                    const data = await selectCloudDocumentWithAuthRetry(userId);
                    if (!currentUser || currentUser.id !== userId) return;

                    needsCloudReconcile = false;
                    const localSnap = readLocalSnapshot(userId);
                    const currentLocal = editor.value;

                    if (!data) {
                        // Cloud has no row yet; upload local draft if non-empty or dirty
                        await flushCloudSave();
                        return;
                    }

                    const cloudContent = data.content ?? '';
                    const cloudUpdatedAt = data.updated_at || new Date().toISOString();

                    if (cloudContent === currentLocal) {
                        hasUnsavedChanges = false;
                        lastSyncedContent = cloudContent;
                        lastSyncedAt = cloudUpdatedAt;
                        writeLocalSnapshot(userId, cloudContent, {
                            dirty: false,
                            updatedAt: cloudUpdatedAt,
                            syncedContent: cloudContent,
                            syncedAt: cloudUpdatedAt
                        });
                        setStatus('Saved to cloud');
                        return;
                    }

                    const baseSynced = localSnap.meta ? localSnap.meta.syncedContent : undefined;

                    if (!hasUnsavedChanges && docRevision === revBefore && (!localSnap.meta || !localSnap.meta.dirty)) {
                        // Local had no unsaved changes; accept fresher cloud version
                        lastSyncedContent = cloudContent;
                        lastSyncedAt = cloudUpdatedAt;
                        docRevision++;
                        editor.value = cloudContent;
                        writeLocalSnapshot(userId, cloudContent, {
                            dirty: false,
                            updatedAt: cloudUpdatedAt,
                            syncedContent: cloudContent,
                            syncedAt: cloudUpdatedAt
                        });
                        applyIncrementalPreviewRender(cloudContent, false);
                        setStatus('Synced from cloud');
                        return;
                    }

                    if (baseSynced !== undefined && cloudContent === baseSynced) {
                        // Cloud did not change while offline -> safe to push local edits
                        lastSyncedContent = baseSynced;
                        hasUnsavedChanges = true;
                        await flushCloudSave();
                    } else {
                        showConflictBanner(cloudContent, currentLocal, cloudUpdatedAt);
                        setStatus('Sync conflict needs review');
                    }
                } catch (err) {
                    retryAttempt++;
                    scheduleCloudRetry();
                }
            }

            function scheduleSaves() {
                if (!currentUser || !isDocumentReady || hasUnresolvedConflict) return;

                docRevision++;
                hasUnsavedChanges = true;
                setStatus('Typing...');

                if (retryTimer) {
                    clearTimeout(retryTimer);
                    retryTimer = null;
                }

                // Fast debounced local backup
                if (localSaveTimer) clearTimeout(localSaveTimer);
                localSaveTimer = setTimeout(() => {
                    localSaveTimer = null;
                    flushLocalDraftSync();
                }, LOCAL_SAVE_DEBOUNCE_MS);

                // Debounced cloud backup
                if (cloudSaveTimer) clearTimeout(cloudSaveTimer);
                cloudSaveTimer = setTimeout(() => {
                    cloudSaveTimer = null;
                    flushCloudSave();
                }, CLOUD_SAVE_DEBOUNCE_MS);
            }

            function sendKeepaliveCloudFlush() {
                if (!currentUser || !isDocumentReady || hasUnresolvedConflict || !hasUnsavedChanges) return;
                if (!latestAccessToken || typeof fetch !== 'function') return;

                const payload = JSON.stringify({
                    user_id: currentUser.id,
                    content: editor.value,
                    updated_at: new Date().toISOString()
                });

                // Keepalive requests are capped around 64KB by browsers
                if (payload.length > 60000) return;

                const endpoint = SUPABASE_URL.replace(/\/$/, '') + '/rest/v1/documents?on_conflict=user_id';
                try {
                    fetch(endpoint, {
                        method: 'POST',
                        keepalive: true,
                        headers: {
                            'Content-Type': 'application/json',
                            'apikey': SUPABASE_KEY,
                            'Authorization': 'Bearer ' + latestAccessToken,
                            'Prefer': 'resolution=merge-duplicates'
                        },
                        body: payload
                    }).catch(() => {});
                } catch (e) {
                    // Ignore keepalive transport errors during unload
                }
            }

            async function checkCloudUpdatesOnFocus() {
                const now = Date.now();
                if (now - lastFocusSyncCheckAt < FOCUS_SYNC_MIN_INTERVAL_MS) return;
                if (!currentUser || !isDocumentReady || hasUnsavedChanges || isSavingToCloud || hasUnresolvedConflict) return;

                if (needsCloudReconcile) {
                    lastFocusSyncCheckAt = now;
                    await reconcileCloudAfterOffline();
                    return;
                }

                lastFocusSyncCheckAt = now;
                const userId = currentUser.id;
                const revBefore = docRevision;

                try {
                    const data = await selectCloudDocumentWithAuthRetry(userId);
                    if (!currentUser || currentUser.id !== userId) return;
                    if (hasUnsavedChanges || isSavingToCloud || hasUnresolvedConflict || docRevision !== revBefore) return;

                    if (data && typeof data.content === 'string' && data.content !== editor.value) {
                        const cloudContent = data.content;
                        const cloudUpdatedAt = data.updated_at || new Date().toISOString();
                        lastSyncedContent = cloudContent;
                        lastSyncedAt = cloudUpdatedAt;
                        docRevision++;
                        editor.value = cloudContent;
                        writeLocalSnapshot(userId, cloudContent, {
                            dirty: false,
                            updatedAt: cloudUpdatedAt,
                            syncedContent: cloudContent,
                            syncedAt: cloudUpdatedAt
                        });
                        applyIncrementalPreviewRender(cloudContent, false);
                        setStatus('Updated from cloud');
                    }
                } catch (e) {
                    // Silent check failure; do not disturb user
                }
            }

            async function loadUserDocument(user) {
                const thisLoadId = ++documentLoadId;

                clearAllSaveTimers();
                hideSyncBanner();
                isDocumentReady = false;
                hasUnsavedChanges = false;
                hasUnresolvedConflict = false;
                needsCloudReconcile = false;
                editor.readOnly = true;
                setStatus('Loading cloud document...');

                const localSnap = readLocalSnapshot(user.id);
                const localContent = localSnap.content;
                const localMeta = localSnap.meta;

                try {
                    const data = await selectCloudDocumentWithAuthRetry(user.id);
                    if (currentUser?.id !== user.id || thisLoadId !== documentLoadId) return;

                    let finalContent = '';
                    let statusText = 'Ready to edit';
                    let shouldPushDirtyLocal = false;

                    if (!data) {
                        finalContent = localContent || '';
                        lastSyncedContent = '';
                        lastSyncedAt = null;

                        if (finalContent.length > 0) {
                            const nowIso = new Date().toISOString();
                            await upsertCloudDocumentWithAuthRetry(user.id, finalContent, nowIso);
                            if (currentUser?.id !== user.id || thisLoadId !== documentLoadId) return;
                            lastSyncedContent = finalContent;
                            lastSyncedAt = nowIso;
                            writeLocalSnapshot(user.id, finalContent, {
                                dirty: false,
                                updatedAt: nowIso,
                                syncedContent: finalContent,
                                syncedAt: nowIso
                            });
                            statusText = 'Local document migrated to cloud';
                        } else {
                            writeLocalSnapshot(user.id, '', {
                                dirty: false,
                                updatedAt: new Date().toISOString(),
                                syncedContent: '',
                                syncedAt: null
                            });
                        }
                    } else {
                        const cloudContent = data.content ?? '';
                        const cloudUpdatedAt = data.updated_at || new Date().toISOString();
                        const hasDirtyLocal = Boolean(localMeta && localMeta.dirty && localContent !== null && localContent !== cloudContent);

                        if (hasDirtyLocal) {
                            const baseSynced = localMeta.syncedContent;
                            if (baseSynced !== undefined && cloudContent === baseSynced) {
                                // Local draft was never uploaded and cloud is unchanged
                                finalContent = localContent;
                                lastSyncedContent = baseSynced;
                                lastSyncedAt = localMeta.syncedAt || cloudUpdatedAt;
                                shouldPushDirtyLocal = true;
                                statusText = 'Syncing unsaved local draft...';
                            } else {
                                // Both local and cloud diverged -> let user resolve safely
                                finalContent = localContent;
                                lastSyncedContent = baseSynced !== undefined ? baseSynced : cloudContent;
                                lastSyncedAt = cloudUpdatedAt;
                                showConflictBanner(cloudContent, localContent, cloudUpdatedAt);
                                statusText = 'Sync conflict needs review';
                            }
                        } else {
                            finalContent = cloudContent;
                            lastSyncedContent = cloudContent;
                            lastSyncedAt = cloudUpdatedAt;
                            writeLocalSnapshot(user.id, cloudContent, {
                                dirty: false,
                                updatedAt: cloudUpdatedAt,
                                syncedContent: cloudContent,
                                syncedAt: cloudUpdatedAt
                            });
                            statusText = 'Loaded from cloud';
                        }
                    }

                    if (currentUser?.id !== user.id || thisLoadId !== documentLoadId) return;

                    editor.value = finalContent;
                    editor.readOnly = false;
                    isDocumentReady = true;

                    if (isRenderEnabled) {
                        applyIncrementalPreviewRender(finalContent, false);
                    } else {
                        clearRenderedPreview();
                    }

                    setStatus(statusText);

                    if (shouldPushDirtyLocal) {
                        hasUnsavedChanges = true;
                        flushCloudSave();
                    }
                } catch (error) {
                    if (currentUser?.id !== user.id || thisLoadId !== documentLoadId) return;

                    if (localContent !== null) {
                        // Local backup exists -> allow offline editing and mark for safe cloud reconciliation
                        editor.value = localContent;
                        editor.readOnly = false;
                        isDocumentReady = true;
                        needsCloudReconcile = true;
                        hasUnsavedChanges = Boolean(localMeta && localMeta.dirty);
                        lastSyncedContent = localMeta && typeof localMeta.syncedContent === 'string'
                            ? localMeta.syncedContent
                            : null;

                        if (isRenderEnabled) {
                            applyIncrementalPreviewRender(localContent, false);
                        } else {
                            clearRenderedPreview();
                        }

                        setStatus('Cloud unreachable — using local copy (will sync when online)');
                        retryAttempt = 1;
                        scheduleCloudRetry();
                    } else {
                        // Do NOT allow blank overwrite of an unseen cloud document
                        editor.value = '';
                        editor.readOnly = true;
                        isDocumentReady = false;
                        clearRenderedPreview();
                        showCloudRetryBanner('Could not reach cloud to load your document. Your cloud data is safe.');
                        setStatus('Cloud load failed: ' + (error?.message || 'Network error'));
                    }
                }
            }

            function onEditorContentChanged() {
                schedulePreviewRender();
                scheduleSaves();
                updateAutocomplete();
            }

            /* ============================================================
               8. Authentication
               ============================================================ */
            const supabaseClient = window.supabase
                ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY)
                : null;

            function setAuthButtonsDisabled(disabled) {
                signInBtn.disabled = disabled;
                signUpBtn.disabled = disabled;
            }

            function getEmailRedirectUrl() {
                if (window.location.protocol === 'http:' || window.location.protocol === 'https:') {
                    return window.location.origin + window.location.pathname;
                }
                return undefined;
            }

            function initAuth() {
                if (!supabaseClient) {
                    authPanel.hidden = false;
                    setAuthButtonsDisabled(true);
                    authMessage.textContent = 'Authentication service failed to load. Please check your connection and reload.';
                    return;
                }

                let initialAuthResolved = false;
                const authRevealTimer = setTimeout(() => {
                    if (!initialAuthResolved) {
                        authPanel.hidden = false;
                    }
                }, 250);

                authForm.addEventListener('submit', async (event) => {
                    event.preventDefault();
                    if (!authForm.reportValidity()) return;

                    setAuthButtonsDisabled(true);
                    authMessage.textContent = 'Signing in...';

                    try {
                        const { error } = await supabaseClient.auth.signInWithPassword({
                            email: authEmail.value.trim(),
                            password: authPassword.value
                        });

                        if (error) {
                            authMessage.textContent = error.message;
                        }
                    } catch (error) {
                        authMessage.textContent = error.message || 'Sign in failed. Please try again.';
                    } finally {
                        setAuthButtonsDisabled(false);
                    }
                });

                signUpBtn.addEventListener('click', async () => {
                    if (!authForm.reportValidity()) return;

                    setAuthButtonsDisabled(true);
                    authMessage.textContent = 'Creating account...';

                    try {
                        const redirectUrl = getEmailRedirectUrl();
                        const { data, error } = await supabaseClient.auth.signUp({
                            email: authEmail.value.trim(),
                            password: authPassword.value,
                            options: redirectUrl ? { emailRedirectTo: redirectUrl } : undefined
                        });

                        if (error) {
                            authMessage.textContent = error.message;
                            return;
                        }

                        if (!data.session) {
                            authMessage.textContent = 'Account created! Please check your email to confirm your account.';
                        }
                    } catch (error) {
                        authMessage.textContent = error.message || 'Account creation failed. Please try again.';
                    } finally {
                        setAuthButtonsDisabled(false);
                    }
                });

                signOutBtn.addEventListener('click', async () => {
                    signOutBtn.disabled = true;

                    try {
                        flushLocalDraftSync();
                        if (currentUser && isDocumentReady && hasUnsavedChanges && !hasUnresolvedConflict) {
                            clearAllSaveTimers();
                            setStatus('Saving before sign out...');
                            await flushCloudSave().catch((err) => {
                                console.error('Save before sign out failed:', err);
                            });
                        }

                        const { error } = await supabaseClient.auth.signOut({ scope: 'local' });
                        if (error) {
                            setStatus(error.message);
                        }
                    } catch (error) {
                        setStatus(error.message || 'Sign out failed.');
                    } finally {
                        signOutBtn.disabled = false;
                    }
                });

                supabaseClient.auth.onAuthStateChange((event, session) => {
                    initialAuthResolved = true;
                    clearTimeout(authRevealTimer);

                    const nextUser = session?.user ?? null;
                    latestAccessToken = session?.access_token ?? null;

                    if (nextUser) {
                        const isSameLoadedUser = activeUserId === nextUser.id;
                        currentUser = nextUser;

                        document.body.classList.remove('signed-out');
                        authPanel.hidden = true;
                        authMessage.textContent = '';
                        authPassword.value = '';

                        if (!isSameLoadedUser) {
                            activeUserId = nextUser.id;
                            isDocumentReady = false;
                            hasUnsavedChanges = false;
                            hasUnresolvedConflict = false;
                            needsCloudReconcile = false;
                            clearAllSaveTimers();
                            editor.readOnly = true;

                            setTimeout(() => {
                                if (currentUser?.id === nextUser.id) {
                                    loadUserDocument(nextUser);
                                }
                            }, 0);
                        }
                    } else {
                        documentLoadId++;
                        clearAllSaveTimers();
                        hideSyncBanner();
                        hideAutocomplete();
                        closePdfModal();

                        currentUser = null;
                        activeUserId = null;
                        isDocumentReady = false;
                        hasUnsavedChanges = false;
                        hasUnresolvedConflict = false;
                        needsCloudReconcile = false;
                        lastSyncedContent = null;
                        lastSyncedAt = null;

                        document.body.classList.add('signed-out');
                        authPanel.hidden = false;

                        editor.readOnly = false;
                        editor.value = '';
                        clearRenderedPreview();

                        authMessage.textContent = '';
                        authPassword.value = '';
                        setStatus('Signed out');

            /* ============================================================
               9. Shared Export Loaders + Full-Preview PNG Export
               ============================================================ */
            let exportingPng = false;
            let html2canvasPromise = null;
            let jsPdfPromise = null;

            function loadHtml2Canvas() {
                if (typeof window.html2canvas === 'function') {
                    return Promise.resolve(window.html2canvas);
                }

                if (!html2canvasPromise) {
                    html2canvasPromise = new Promise((resolve, reject) => {
                        const script = document.createElement('script');
                        script.src = 'https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js';
                        script.onload = () => {
                            if (typeof window.html2canvas === 'function') {
                                resolve(window.html2canvas);
                            } else {
                                reject(new Error('The renderer loaded but was not available.'));
                            }
                        };
                        script.onerror = () => reject(
                            new Error('Could not load the image renderer. Check your internet connection and try again.')
                        );
                        document.head.appendChild(script);
                    }).catch((error) => {
                        html2canvasPromise = null;
                        throw error;
                    });
                }

                return html2canvasPromise;
            }

            function loadJsPdf() {
                const existing = (window.jspdf && window.jspdf.jsPDF) || window.jsPDF;
                if (typeof existing === 'function') {
                    return Promise.resolve(existing);
                }

                if (!jsPdfPromise) {
                    jsPdfPromise = new Promise((resolve, reject) => {
                        const script = document.createElement('script');
                        script.src = 'https://cdn.jsdelivr.net/npm/jspdf@3.0.4/dist/jspdf.umd.min.js';
                        script.onload = () => {
                            const ctor = (window.jspdf && window.jspdf.jsPDF) || window.jsPDF;
                            if (typeof ctor === 'function') {
                                resolve(ctor);
                            } else {
                                reject(new Error('The PDF library loaded but was not available.'));
                            }
                        };
                        script.onerror = () => reject(
                            new Error('Could not load the PDF library. Check your internet connection and try again.')
                        );
                        document.head.appendChild(script);
                    }).catch((error) => {
                        jsPdfPromise = null;
                        throw error;
                    });
                }

                return jsPdfPromise;
            }

            function chooseExportScale(width, height, preferredScale = EXPORT_SCALE) {
                const scaleForWidth = MAX_CANVAS_DIMENSION / width;
                const scaleForHeight = MAX_CANVAS_DIMENSION / height;
                const scaleForPixelCount = Math.sqrt(MAX_CANVAS_PIXELS / (width * height));
                return Math.min(preferredScale, scaleForWidth, scaleForHeight, scaleForPixelCount);
            }

            function createExportSurfaceClone(options) {
                const opts = options || {};
                const previewBounds = preview.getBoundingClientRect();
                const previewStyles = getComputedStyle(preview);
                const widthPx = opts.widthPx || Math.max(320, Math.ceil(previewBounds.width));
                const backgroundColor = opts.backgroundColor || previewStyles.backgroundColor;
                const textColor = opts.textColor || previewStyles.color;
                const fontSizePx = opts.fontSizePx ? opts.fontSizePx + 'px' : previewStyles.fontSize;
                const padding = typeof opts.padding === 'string' ? opts.padding : previewStyles.padding;

                const clone = document.createElement('div');
                clone.className = 'preview-surface preview-export-clone';
                clone.dataset.previewExportClone = 'true';

                if (opts.docTitle) {
                    const heading = document.createElement('div');
                    heading.textContent = opts.docTitle;
                    heading.style.fontSize = '1.45em';
                    heading.style.fontWeight = '700';
                    heading.style.marginBottom = '14px';
                    heading.style.paddingBottom = '8px';
                    heading.style.borderBottom = '1px solid ' + (opts.titleBorderColor || '#cccccc');
                    clone.appendChild(heading);
                }

                const contentContainer = document.createElement('div');
                contentContainer.style.display = 'contents';
                renderAllSynchronouslyInto(contentContainer, editor.value);
                clone.appendChild(contentContainer);

                const overrides = {
                    position: 'fixed',
                    left: '0px',
                    top: '0px',
                    width: widthPx + 'px',
                    height: 'auto',
                    'max-height': 'none',
                    overflow: 'visible',
                    'overflow-y': 'visible',
                    flex: 'none',
                    'min-height': '0',
                    margin: '0',
                    padding: padding,
                    opacity: '0',
                    'z-index': '-2147483648',
                    'pointer-events': 'none',
                    background: backgroundColor,
                    color: textColor,
                    'font-size': fontSizePx,
                    'border-left-color': 'transparent',
                    'border-left-width': '0px',
                    transition: 'none',
                    'box-sizing': 'border-box'
                };

                for (const [property, value] of Object.entries(overrides)) {
                    clone.style.setProperty(property, value, 'important');
                }

                document.body.appendChild(clone);
                return clone;
            }

            function canvasToBlob(canvas) {
                return new Promise((resolve, reject) => {
                    canvas.toBlob((blob) => {
                        if (blob) {
                            resolve(blob);
                        } else {
                            reject(new Error('The browser could not create the PNG file. Try exporting less content at once.'));
                        }
                    }, 'image/png');
                });
            }

            async function exportPreviewAsPng() {
                if (exportingPng || !currentUser) return;
                exportingPng = true;
                exportBtn.disabled = true;

                let clone = null;
                try {
                    setStatus('Preparing PNG preview...');
                    const html2canvas = await loadHtml2Canvas();

                    if (document.fonts && document.fonts.ready) {
                        await document.fonts.ready;
                    }

                    clone = createExportSurfaceClone();
                    await new Promise((resolve) => requestAnimationFrame(resolve));

                    const bounds = clone.getBoundingClientRect();
                    const width = Math.max(Math.ceil(bounds.width), clone.scrollWidth);
                    const height = Math.max(Math.ceil(bounds.height), clone.scrollHeight);

                    if (!width || !height) {
                        throw new Error('The preview has no exportable dimensions.');
                    }

                    const scale = chooseExportScale(width, height, EXPORT_SCALE);
                    if (!Number.isFinite(scale) || scale <= 0) {
                        throw new Error('The preview is too large for this browser to export as one image.');
                    }

                    setStatus('Capturing full preview...');
                    const canvas = await html2canvas(clone, {
                        backgroundColor: getComputedStyle(preview).backgroundColor,
                        scale,
                        width,
                        height,
                        x: 0,
                        y: 0,
                        windowWidth: Math.max(document.documentElement.clientWidth, width),
                        windowHeight: Math.max(window.innerHeight, height),
                        scrollX: 0,
                        scrollY: 0,
                        useCORS: true,
                        allowTaint: false,
                        logging: false,
                        onclone: (clonedDocument) => {
                            const exportClone = clonedDocument.querySelector('[data-preview-export-clone="true"]');
                            if (exportClone) {
                                exportClone.style.setProperty('opacity', '1', 'important');
                                exportClone.style.setProperty('z-index','2147483647', 'important');
                            }
                        }
                    });

                    setStatus('Saving PNG...');
                    const blob = await canvasToBlob(canvas);
                    const objectUrl = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = objectUrl;
                    link.download = 'text-latex-preview.png';
                    document.body.appendChild(link);
                    link.click();
                    link.remove();
                    setTimeout(() => URL.revokeObjectURL(objectUrl), 1500);

                    const dimensions = canvas.width.toLocaleString() + ' × ' + canvas.height.toLocaleString() + ' px';
                    const scaleNote = scale < 1 ? ' (scaled down to fit browser limits)' : '';
                    setStatus('Exported full preview: ' + dimensions + scaleNote);
                } catch (error) {
                    console.error('Preview PNG export failed:', error);
                    setStatus('Export failed: ' + error.message);
                } finally {
                    if (clone) clone.remove();
                    exportingPng = false;
                    exportBtn.disabled = false;
                }
            }

            /* ============================================================
               10. Configurable PDF Export Modal & Smart Pagination
               ============================================================ */
            const PAGE_SIZES_PT = {
                letter: [612, 792],
                a4: [595.28, 841.89],
                legal: [612, 1008],
                a5: [419.53, 595.28]
            };

            const MARGIN_MM_MAP = {
                normal: 20,
                narrow: 10,
                wide: 30,
                none: 0
            };

            let exportingPdf = false;
            let lastFocusedBeforeModal = null;

            function mmToPt(mm) {
                return mm * 2.83464567;
            }

            function parseRgbColor(cssColor, fallback) {
                const match = String(cssColor || '').match(/rgba?\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)/i);
                if (!match) return fallback;
                return {
                    r: Number(match[1]),
                    g: Number(match[2]),
                    b: Number(match[3])
                };
            }

            function getPdfOptionsFromForm() {

                    .replace(/[\\/:*?"<>|]+/g, '-') || 'latex-notebook';

                return {
                    fileName: cleanName,
                    docTitle: pdfDocTitle.value.trim(),
                    pageSize: PAGE_SIZES_PT[pdfPageSize.value] ? pdfPageSize.value : 'letter',
                    orientation: pdfOrientation.value === 'landscape' ? 'landscape' : 'portrait',
                    margins: Object.prototype.hasOwnProperty.call(MARGIN_MM_MAP, pdfMargins.value) ? pdfMargins.value : 'normal',
                    theme: pdfTheme.value === 'current' ? 'current' : 'light',
                    fontSize: Number(pdfFontSize.value) || 15,
                    quality: Number(pdfQuality.value) === 2 ? 2 : 3,

                    pageSize: opts.pageSize,

                try {

                    if (saved.margins && Object.prototype.hasOwnProperty.call(MARGIN_MM_MAP, saved.margins)) pdfMargins.value = saved.margins;
                    if (saved.theme) pdfTheme.value = saved.theme;
