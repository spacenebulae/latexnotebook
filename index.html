<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Text & LaTeX Editor</title>
    <!-- Load KaTeX CSS and JS from working CDN links -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.19.0/dist/katex.min.css" integrity="sha384-3rdsX6e5mueWyoweR9NIVmtEsUkokpBT/0ALqKKIBMr9j4qhHkaIkAcGgsE6uVlp" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.19.0/dist/katex.min.js" integrity="sha384-QFFtAGzvvj+bfgCGxXJlNZZR1nXEZgvG8tDLCCY1F19xl20WlfTYgguB4VcNdxYk" crossorigin="anonymous"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.19.0/dist/contrib/auto-render.min.js" integrity="sha384-bjyGPfbij8/NDKJhSGZNP/khQVgtHUE5exjm4Ydllo42FwIgYsdLO2lXGmRBf5Mz" crossorigin="anonymous"
    onload="renderMathInElement(document.body);"></script>
    <!-- Fonts (added): Nunito ExtraBold is the default font for the editor and other
         fields; JetBrains Mono is one of the selectable choices in the font picker -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800&family=JetBrains+Mono&display=swap" rel="stylesheet">

    <!-- Theme + font bootstrap (added): applies the saved choices before first paint
         so the page never flashes in the wrong theme -->
    <script>
        (function () {
            var FONTS = {
                nunito:    { label: 'Nunito ExtraBold',  family: "'Nunito', Verdana, sans-serif", weight: '800' },
                verdana:   { label: 'Verdana',           family: 'Verdana, Geneva, sans-serif', weight: '400' },
                helvetica: { label: 'Helvetica',         family: 'Helvetica, Arial, sans-serif', weight: '400' },
                jetbrains: { label: 'JetBrains Mono',    family: "'JetBrains Mono', Consolas, monospace", weight: '400' },
                calibri:   { label: 'Calibri',           family: "Calibri, Carlito, 'Segoe UI', sans-serif", weight: '400' },
                arial:     { label: 'Arial',             family: 'Arial, Helvetica, sans-serif', weight: '400' },
                consolas:  { label: 'Consolas',          family: "Consolas, 'Liberation Mono', 'Courier New', monospace", weight: '400' }
            };
            window.LATEX_EDITOR_FONTS = FONTS;
            window.applyEditorFont = function (key) {
                var f = FONTS[key] || FONTS.nunito;
                document.documentElement.style.setProperty('--app-font', f.family);
                document.documentElement.style.setProperty('--app-font-weight', f.weight);
            };
            try {
                var theme = localStorage.getItem('latex_editor_theme');
                if (theme !== 'light' && theme !== 'dark') {
                    // No saved choice yet: follow the system preference
                    theme = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
                }
                document.documentElement.setAttribute('data-theme', theme);
                var fontKey = localStorage.getItem('latex_editor_font');
                window.applyEditorFont(FONTS[fontKey] ? fontKey : 'nunito');
            } catch (e) {
                document.documentElement.setAttribute('data-theme', 'light');
                window.applyEditorFont('nunito');
            }
        })();
    </script>
    <style>
        /* ---- Theme variables (added): light palette + dark override ---- */
        :root {
            color-scheme: light;
            --bg: #ffffff;
            --text: #333333;
            --editor-bg: #fafafa;
            --preview-bg: #ffffff;
            --border: #dddddd;
            --toolbar-bg: #f5f5f5;
            --btn-bg: #ffffff;
            --btn-border: #cccccc;
            --btn-hover-bg: #efefef;
            --btn-hover-border: #bbbbbb;
            --btn-text: #333333;
            --hint-text: #999999;
            --status-text: #888888;
            --status-bg: rgba(255, 255, 255, 0.8);
            --placeholder: #aaaaaa;
            /* Font used by the editor and other fields (NOT the render); set from JS */
            --app-font: 'Nunito', Verdana, sans-serif;
            --app-font-weight: 800;
        }
        :root[data-theme="dark"] {
            color-scheme: dark;
            --bg: #1e1e1e;
            --text: #d4d4d4;
            --editor-bg: #1e1e1e;
            --preview-bg: #212121;
            --border: #3a3a3a;
            --toolbar-bg: #252525;
            --btn-bg: #2d2d2d;
            --btn-border: #484848;
            --btn-hover-bg: #383838;
            --btn-hover-border: #5c5c5c;
            --btn-text: #d4d4d4;
            --hint-text: #808080;
            --status-text: #9a9a9a;
            --status-bg: rgba(30, 30, 30, 0.85);
            --placeholder: #6a6a6a;
        }
        body {
            font-family: var(--app-font);
            font-weight: var(--app-font-weight);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            color: var(--text);
            background: var(--bg);
            transition: background-color 0.25s ease, color 0.25s ease;
        }
        .main {
            flex: 1;
            display: flex;
            min-height: 0;
        }
        .pane {
            flex: 1;
            height: 100%;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }
        textarea {
            width: 100%;
            flex: 1;
            min-height: 0;
            border: none;
            padding: 20px;
            font-size: 16px;
            line-height: 1.5;
            resize: none;
            outline: none;
            background-color: var(--editor-bg);
            color: var(--text);
            font-family: var(--app-font);
            font-weight: var(--app-font-weight);
            box-sizing: border-box;
            transition: background-color 0.25s ease, color 0.25s ease;
        }
        textarea::placeholder {
            color: var(--placeholder);
            opacity: 1;
        }
        #preview {
            padding: 20px;
            overflow-y: auto;
            border-left: 1px solid var(--border);
            white-space: pre-wrap; /* Preserves line breaks */
            font-size: 16px;
            line-height: 1.6;
            flex: 1;
            min-height: 0;
            box-sizing: border-box;
            background: var(--preview-bg);
            color: var(--text);
            /* The render keeps its own neutral font, independent of the editor font */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-weight: 400;
            transition: background-color 0.25s ease, color 0.25s ease, border-color 0.25s ease;
        }
        /* ---- Toolbar (now spans the top of the app): export, font picker, theme toggle ---- */
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            border-bottom: 1px solid var(--border);
            background: var(--toolbar-bg);
            flex: none;
            font-family: var(--app-font);
            font-weight: var(--app-font-weight);
            transition: background-color 0.25s ease, border-color 0.25s ease;
        }
        .toolbar button {
            font-family: var(--app-font);
            font-weight: var(--app-font-weight);
            font-size: 13px;
            padding: 6px 14px;
            border: 1px solid var(--btn-border);
            border-radius: 6px;
            background: var(--btn-bg);
            color: var(--btn-text);
            cursor: pointer;
            transition: background-color 0.15s ease, border-color 0.15s ease, color 0.25s ease;
        }
        .toolbar button:hover:not(:disabled) {
            background: var(--btn-hover-bg);
            border-color: var(--btn-hover-border);
        }
        .toolbar button:disabled {
            opacity: 0.5;
            cursor: default;
        }
        .kbd-hint {
            font-size: 12px;
            color: var(--hint-text);
        }
        .toolbar .spacer {
            flex: 1;
        }
        /* ---- Font picker (added) ---- */
        .font-label {
            font-size: 13px;
            color: var(--hint-text);
        }
        select {
            font-family: var(--app-font);
            font-weight: var(--app-font-weight);
            font-size: 13px;
            padding: 5px 8px;
            border: 1px solid var(--btn-border);
            border-radius: 6px;
            background: var(--btn-bg);
            color: var(--btn-text);
            cursor: pointer;
            max-width: 220px;
        }
        select:hover {
            border-color: var(--btn-hover-border);
        }
        /* ---- Theme toggle (added): small square icon button ---- */
        #themeToggle {
            width: 30px;
            height: 30px;
            padding: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        #themeToggle svg {
            display: block;
        }
        .status {
            position: fixed;
            bottom: 10px;
            right: 20px;
            font-size: 12px;
            color: var(--status-text);
            background: var(--status-bg);
            padding: 2px 5px;
            border-radius: 3px;
            font-family: var(--app-font);
            font-weight: var(--app-font-weight);
            transition: background-color 0.25s ease, color 0.25s ease;
        }
    </style>
</head>
<body>

    <!-- Top toolbar (moved up so it spans the whole app): export, font picker, theme toggle -->
    <div class="toolbar">
        <!-- Export button: click or press Ctrl+S to save the entire preview as one PNG -->
        <button id="exportBtn" type="button" title="Export all text and rendered equations in the right preview as one high-resolution PNG">Export preview as PNG</button>
        <span class="kbd-hint">or press Ctrl&nbsp;+&nbsp;S</span>
        <span class="spacer"></span>
        <!-- Font picker (added): font for the editor and other fields, not the rendered preview -->
        <label class="font-label" for="fontSelect">Font</label>
        <select id="fontSelect" title="Font for the editor and other fields (the rendered preview is not affected)"></select>
        <!-- Theme toggle (added): small button that switches light/dark mode, choice is remembered -->
        <button id="themeToggle" type="button" title="Switch to dark mode" aria-label="Switch to dark mode">
            <svg id="iconMoon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            <svg id="iconSun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display: none;"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        </button>
    </div>

    <div class="main">
        <!-- Left side: Input -->
        <div class="pane">
            <textarea id="editor" placeholder="Type plain text here. Use $...$ for inline math and $$...$$ for block math."></textarea>
        </div>

        <!-- Right side: Live Preview -->
        <div class="pane">
            <div id="preview"></div>
        </div>
    </div>
    <div class="status" id="status">Saved</div>

    <script>
        const editor = document.getElementById('editor');
        const preview = document.getElementById('preview');
        const status = document.getElementById('status');
        const exportBtn = document.getElementById('exportBtn');
        let saveTimeout;

        /* ============================================================
           Theme toggle & font picker (added)
           ============================================================ */
        const fontSelect = document.getElementById('fontSelect');
        const themeToggle = document.getElementById('themeToggle');
        const iconMoon = document.getElementById('iconMoon');
        const iconSun = document.getElementById('iconSun');

        // ---- Font picker: changes the font of the editor and the other fields.
        //      The rendered preview is deliberately left untouched. ----
        const FONTS = window.LATEX_EDITOR_FONTS;
        Object.keys(FONTS).forEach(function (key) {
            const opt = document.createElement('option');
            opt.value = key;
            opt.textContent = FONTS[key].label;
            // Show every choice in its own font inside the dropdown
            opt.style.fontFamily = FONTS[key].family;
            opt.style.fontWeight = FONTS[key].weight;
            fontSelect.appendChild(opt);
        });
        let savedFont = null;
        try { savedFont = localStorage.getItem('latex_editor_font'); } catch (e) {}
        fontSelect.value = FONTS[savedFont] ? savedFont : 'nunito';
        window.applyEditorFont(fontSelect.value); // keep in sync with the head bootstrap
        fontSelect.addEventListener('change', function () {
            window.applyEditorFont(fontSelect.value);
            try { localStorage.setItem('latex_editor_font', fontSelect.value); } catch (e) {}
        });

        // ---- Theme toggle: switches light/dark mode, choice is remembered ----
        function currentTheme() {
            return document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
        }
        function updateThemeButton() {
            const dark = currentTheme() === 'dark';
            iconMoon.style.display = dark ? 'none' : 'block';
            iconSun.style.display = dark ? 'block' : 'none';
            const label = dark ? 'Switch to light mode' : 'Switch to dark mode';
            themeToggle.title = label;
            themeToggle.setAttribute('aria-label', label);
            themeToggle.setAttribute('aria-pressed', String(dark));
        }
        themeToggle.addEventListener('click', function () {
            const next = currentTheme() === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            try { localStorage.setItem('latex_editor_theme', next); } catch (e) {}
            updateThemeButton();
        });
        updateThemeButton();

        // Load saved content on startup (or leave blank if none)
        const savedContent = localStorage.getItem('latex_editor_content');
        if (savedContent) {
            editor.value = savedContent;
        } else {
            editor.value = ""; // Removed greeting text
        }

        // Render function
        function updatePreview() {
            const text = editor.value;

            // Use innerHTML instead of textContent so KaTeX can inject HTML nodes
            preview.innerHTML = text;

            // Tell KaTeX to find and render math delimiters
            // (guarded so the very first render before KaTeX finishes loading doesn't throw)
            if (typeof renderMathInElement === 'function') {
                renderMathInElement(preview, {
                    delimiters: [
                        {left: '$$', right: '$$', display: true},
                        {left: '$', right: '$', display: false}
                    ],
                    throwOnError: false
                });
            }

            // Handle auto-save with a tiny debounce so it doesn't lag while typing
            status.textContent = "Typing...";
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(() => {
                localStorage.setItem('latex_editor_content', text);
                status.textContent = "Saved";
            }, 300);
        }

        // Listen for typing events
        editor.addEventListener('input', updatePreview);

        // Initial render
        updatePreview();

        // Once KaTeX finishes loading, re-render so inline $...$ math from a saved
        // draft is rendered too (the auto-render onload pass only handles $$..$$,
        // which would otherwise leave inline math unrendered until the next keystroke)
        window.addEventListener('load', updatePreview);

        /* ============================================================
           Full-preview PNG export
           - Exports normal text and rendered equations together.
           - Captures all preview content, including content below the
             visible scroll area.
           - Adjusts resolution to fit conservative browser canvas limits.
           ============================================================ */

        const EXPORT_SCALE = 3;
        const MAX_CANVAS_DIMENSION = 30000;
        const MAX_CANVAS_PIXELS = 90000000;

        let exporting = false;
        let html2canvasPromise = null;

        function loadHtml2Canvas() {
            if (typeof window.html2canvas === 'function') {
                return Promise.resolve(window.html2canvas);
            }

            if (!html2canvasPromise) {
                html2canvasPromise = new Promise((resolve, reject) => {
                    const script = document.createElement('script');
                    script.src = 'https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js';
                    script.onload = () => {
                        if (typeof window.html2canvas === 'function') {
                            resolve(window.html2canvas);
                        } else {
                            reject(new Error('The PNG renderer loaded but was not available.'));
                        }
                    };
                    script.onerror = () => reject(new Error('Could not load the PNG renderer. Check your internet connection and try again.'));
                    document.head.appendChild(script);
                }).catch(error => {
                    html2canvasPromise = null;
                    throw error;
                });
            }

            return html2canvasPromise;
        }

        function chooseExportScale(width, height) {
            const scaleForWidth = MAX_CANVAS_DIMENSION / width;
            const scaleForHeight = MAX_CANVAS_DIMENSION / height;
            const scaleForPixelCount = Math.sqrt(MAX_CANVAS_PIXELS / (width * height));
            return Math.min(EXPORT_SCALE, scaleForWidth, scaleForHeight, scaleForPixelCount);
        }

        function createExportClone() {
            const previewBounds = preview.getBoundingClientRect();
            const previewStyles = getComputedStyle(preview);
            const clone = preview.cloneNode(true);
            clone.dataset.previewExportClone = 'true';

            // Match the live preview's width, typography, and current theme,
            // but let the clone expand to the full height of its content.
            const overrides = {
                position: 'fixed',
                left: '0px',
                top: '0px',
                width: Math.ceil(previewBounds.width) + 'px',
                height: 'auto',
                'max-height': 'none',
                overflow: 'visible',
                'overflow-y': 'visible',
                flex: 'none',
                'min-height': '0',
                margin: '0',
                opacity: '0',
                'z-index': '-2147483648',
                'pointer-events': 'none',
                background: previewStyles.backgroundColor,
                color: previewStyles.color,
                transition: 'none',
                'box-sizing': 'border-box'
            };

            for (const [property, value] of Object.entries(overrides)) {
                clone.style.setProperty(property, value, 'important');
            }

            document.body.appendChild(clone);
            return clone;
        }

        function canvasToBlob(canvas) {
            return new Promise((resolve, reject) => {
                canvas.toBlob(blob => {
                    if (blob) {
                        resolve(blob);
                    } else {
                        reject(new Error('The browser could not create the PNG file. Try exporting less content at once.'));
                    }
                }, 'image/png');
            });
        }

        async function exportPreviewAsPng() {
            if (exporting) return;
            exporting = true;
            exportBtn.disabled = true;

            let clone = null;
            try {
                status.textContent = 'Preparing preview...';
                const html2canvas = await loadHtml2Canvas();

                // Wait for KaTeX and any other web fonts to finish loading.
                if (document.fonts && document.fonts.ready) {
                    await document.fonts.ready;
                }

                clone = createExportClone();
                await new Promise(resolve => requestAnimationFrame(resolve));

                const bounds = clone.getBoundingClientRect();
                const width = Math.ceil(bounds.width);
                const height = Math.ceil(bounds.height);

                if (!width || !height) {
                    throw new Error('The preview has no exportable dimensions.');
                }

                const scale = chooseExportScale(width, height);
                if (!Number.isFinite(scale) || scale <= 0) {
                    throw new Error('The preview is too large for this browser to export as one image.');
                }

                status.textContent = 'Capturing full preview...';
                const canvas = await html2canvas(clone, {
                    backgroundColor: getComputedStyle(preview).backgroundColor,
                    scale,
                    width,
                    height,
                    x: 0,
                    y: 0,
                    windowWidth: Math.max(document.documentElement.clientWidth, width),
                    windowHeight: Math.max(window.innerHeight, height),
                    scrollX: 0,
                    scrollY: 0,
                    useCORS: true,
                    allowTaint: false,
                    logging: false,
                    onclone: clonedDocument => {
                        const exportClone = clonedDocument.querySelector('[data-preview-export-clone="true"]');
                        if (exportClone) {
                            exportClone.style.setProperty('opacity', '1', 'important');
                            exportClone.style.setProperty('z-index', '2147483647', 'important');
                        }
                    }
                });

                status.textContent = 'Saving PNG...';
                const blob = await canvasToBlob(canvas);
                const objectUrl = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = objectUrl;
                link.download = 'text-latex-preview.png';
                document.body.appendChild(link);
                link.click();
                link.remove();
                setTimeout(() => URL.revokeObjectURL(objectUrl), 1500);

                const dimensions = canvas.width.toLocaleString() + ' × ' + canvas.height.toLocaleString() + ' px';
                const scaleNote = scale < 1 ? ' (scaled down to fit browser limits)' : '';
                status.textContent = 'Exported full preview: ' + dimensions + scaleNote;
            } catch (error) {
                console.error('Preview PNG export failed:', error);
                status.textContent = 'Export failed: ' + error.message;
            } finally {
                if (clone) clone.remove();
                exporting = false;
                exportBtn.disabled = false;
            }
        }

        exportBtn.addEventListener('click', exportPreviewAsPng);

        // Ctrl+S (Windows/Linux) or Cmd+S (Mac) export the full preview.
        document.addEventListener('keydown', event => {
            if ((event.ctrlKey || event.metaKey) && !event.altKey && !event.shiftKey && event.key.toLowerCase() === 's') {
                event.preventDefault();
                exportPreviewAsPng();
            }
        });

    </script>
</body>
</html>
